    function resolveAllianceForYear(partyCode, year){
      const info = partyData.get(partyCode);
      if (!info) return 'NA';
      const alliances = info.alliances || null;
      const value = (alliances && (alliances[String(year)] || alliances[year]))
        || info[`alliance_${year}`]
        || info.alliance_2021
        || info.alliance_2020
        || info.alliance
        || 'NA';
      return normalizeAllianceKey(value) || 'NA';
    }

    function ensureAllianceColor(alliance, hex){
      const key = normalizeAllianceKey(alliance);
      if (!key || allianceOriginalColors.has(key)) return;
      const chosen = isValidHexColor(hex) ? to6Hex(hex) : deterministicColorFor(key);
      allianceOriginalColors.set(key, chosen);
      allianceColors.set(key, pastelizeColor(chosen));
    }

    function buildAllianceColors(parties, override){
      allianceColors = new Map();
      allianceOriginalColors = new Map();

      if (override && typeof override === 'object') {
        for (const key in override) {
          if (!Object.prototype.hasOwnProperty.call(override, key)) continue;
          const a = normalizeAllianceKey(key);
          const hex = to6Hex(override[key] || '');
          if (!a || !isValidHexColor(hex)) continue;
          allianceOriginalColors.set(a, hex);
          allianceColors.set(a, pastelizeColor(hex));
        }
      }

      const candidates = new Map();
      const pushCandidate = (label, hex) => {
        const key = normalizeAllianceKey(label);
        if (!key || allianceOriginalColors.has(key)) return;
        const h = String(hex || '').trim();
        if (!h) return;
        const hex6 = to6Hex(h);
        if (hex6 === '#ffffff' || !isValidHexColor(hex6)) return;
        if (!candidates.has(key)) candidates.set(key, []);
        candidates.get(key).push(hex6);
      };

      for (const p of (parties || [])) {
        const allianceHex = p.alliance_colour_code || p.alliance_color_code || p.alliance_colour || p.alliance_color || p.color || '';
        pushCandidate(p.alliance, allianceHex);
        const map = p.alliances || {};
        for (const y of Object.keys(map)) pushCandidate(map[y], allianceHex);
      }

      for (const [alliance, arr] of candidates) {
        if (!arr.length) continue;
        const freq = new Map();
        for (const h of arr) freq.set(h, (freq.get(h) || 0) + 1);
        const chosen = Array.from(freq.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0][0];
        allianceOriginalColors.set(alliance, chosen);
        allianceColors.set(alliance, pastelizeColor(chosen));
      }

      if (!allianceOriginalColors.has('NA')) {
        allianceOriginalColors.set('NA', '#999999');
        allianceColors.set('NA', '#e5e7eb');
      }
    }

    function getHistoricalAllianceColor(party, year){
      if (!party) return '#f3f4f6';
      const key = resolveAllianceForYear(party, year);
      if (key === 'NA') return '#e5e7eb';
      return allianceColors.get(key) || '#f3f4f6';
    }

    function get2026AllianceColor(row){
      if (!isLive2026Row(row)) return '#f3f4f6';
      const alliance = normalizeAllianceKey(row && row.y2026_winner_alliance);
      const party = String((row && row.y2026_winner_party) || '').trim();
      if (alliance && !allianceColors.has(alliance)) ensureAllianceColor(alliance, '');
      return allianceColors.get(alliance)
        || getHistoricalAllianceColor(party, '2026')
        || ensurePartyColor(party)
        || '#f3f4f6';
    }

    function get2026PartyColor(row){
      if (!isLive2026Row(row)) return '#f3f4f6';
      const party = String((row && row.y2026_winner_party) || '').trim();
      const alliance = normalizeAllianceKey(row && row.y2026_winner_alliance);
      if (alliance && !allianceColors.has(alliance)) ensureAllianceColor(alliance, '');
      return ensurePartyColor(party)
        || allianceColors.get(alliance)
        || getHistoricalAllianceColor(party, '2026')
        || '#f3f4f6';
    }

    function getColorForMode(acNo, mode){
      const cacheKey = `${mode}_${acNo}`;
      if (colorCache.has(cacheKey)) return colorCache.get(cacheKey);

      const row = electionData.get(acNo);
      if (!row) return '#f3f4f6';

      let color = '#f3f4f6';
      switch (mode) {
        case 'alliance-2026':
          color = get2026AllianceColor(row);
          break;
        case 'party-2026':
          color = get2026PartyColor(row);
          break;
        case 'alliance-2021':
        case 'alliance-2020':
          color = allianceColors.get(normalizeAllianceKey(rowAllianceForYear(row, 2021))) || '#f3f4f6';
          break;
        case 'party-2021':
        case 'party-2020':
          color = partyColors.get(rowPartyForYear(row, 2021)) || allianceColors.get(normalizeAllianceKey(rowAllianceForYear(row, 2021))) || '#f3f4f6';
          break;
        case 'alliance-2016':
          color = allianceColors.get(normalizeAllianceKey(row.y2016_winner_alliance))
               || getHistoricalAllianceColor(row.y2016_winner_party, '2016');
          break;
        case 'party-2016':
          color = partyColors.get(row.y2016_winner_party)
               || allianceColors.get(normalizeAllianceKey(row.y2016_winner_alliance))
               || getHistoricalAllianceColor(row.y2016_winner_party, '2016');
          break;
        case 'alliance-2015':
          color = getHistoricalAllianceColor(row.y2015_winner_party, '2015');
          break;
        case 'party-2015':
          color = partyColors.get(row.y2015_winner_party) || getHistoricalAllianceColor(row.y2015_winner_party, '2015');
          break;
        case 'alliance-2010':
          color = getHistoricalAllianceColor(row.y2010_winner_party, '2010');
          break;
        case 'party-2010':
          color = partyColors.get(row.y2010_winner_party) || getHistoricalAllianceColor(row.y2010_winner_party, '2010');
          break;
        case 'reserved': {
          const status = (row.reserved || 'GEN').toUpperCase();
          const reservedColors = { GEN: '#f9fafb', SC: '#dbeafe', ST: '#dcfce7', NA: '#f3f4f6' };
          color = reservedColors[status] || reservedColors.GEN;
          break;
        }
      }
      colorCache.set(cacheKey, color);
      return color;
    }

    function getFillForMode(acNo, mode){
      const baseColor = getColorForMode(acNo, mode);
      const row = electionData.get(acNo);
      if (!row) return baseColor;
      const parsed = parseMode(mode);
      const is2026Mode = parsed && parsed.year === '2026';
      if (!is2026Mode) return baseColor;
      if (!isLeadingStatus(row) || !hasAny2026WinnerField(row)) return baseColor;
      return baseColor;
    }

    function inferColorModes(rows){
      const has = (field) => rows.some(r => r && r[field]);
      const has2026LiveResult = rows.some((row) => isLive2026Row(row));
      const modes = [];
      if (ENABLE_2026_MODES && has2026LiveResult) {
        modes.push('alliance-2026', 'party-2026');
      }
      if (has('y2021_winner_party') || has('y2021_winner_alliance') || has('current_mla_party') || has('current_mla_alliance')) {
        modes.push('alliance-2021', 'party-2021');
      }
      if (has('y2016_winner_party') || has('y2016_winner_alliance')) {
        modes.push('alliance-2016', 'party-2016');
      }
      if (has('y2015_winner_party')) {
        modes.push('alliance-2015', 'party-2015');
      }
      if (has('y2010_winner_party')) {
        modes.push('alliance-2010', 'party-2010');
      }
      return modes;
    }

    function parseMode(mode){
      const match = String(mode || '').trim().match(/^(alliance|party)-(\d{4})$/);
      if (!match) return null;
      return { view: match[1], year: match[2] };
    }

    function inferAvailableYears(modes){
      const years = [];
      for (const mode of (modes || [])) {
        const parsed = parseMode(mode);
        if (!parsed || years.includes(parsed.year)) continue;
        years.push(parsed.year);
      }
      return years;
    }

    function hasMode(view, year){
      return activeColorModes.includes(`${view}-${year}`);
    }

    function fallbackModeForYear(year){
      if (hasMode('alliance', year)) return `alliance-${year}`;
      if (hasMode('party', year)) return `party-${year}`;
      return '';
    }

    function resolveModeForControls(){
      if (currentModeYear === 'reserved') {
        return activeColorModes.includes('reserved') ? 'reserved' : '';
      }
      if (!currentModeYear) return '';

      const preferred = `${currentModeView}-${currentModeYear}`;
      if (activeColorModes.includes(preferred)) return preferred;

      const alternateView = currentModeView === 'alliance' ? 'party' : 'alliance';
      const alternate = `${alternateView}-${currentModeYear}`;
      if (activeColorModes.includes(alternate)) return alternate;

      return fallbackModeForYear(currentModeYear);
    }

    function syncControlsFromCurrentMode(){
      const parsed = parseMode(currentColorMode);
      if (parsed) {
        currentModeView = parsed.view;
        currentModeYear = parsed.year;
        return;
      }

      if (currentColorMode === 'reserved' && activeColorModes.includes('reserved')) {
        currentModeYear = 'reserved';
        return;
      }

      if (ENABLE_2026_MODES && activeColorModes.includes('alliance-2026')) {
        currentColorMode = 'alliance-2026';
        currentModeView = 'alliance';
        currentModeYear = '2026';
        return;
      }

      const firstYearMode = activeColorModes.find((mode) => !!parseMode(mode));
      if (firstYearMode) {
        const first = parseMode(firstYearMode);
        currentColorMode = firstYearMode;
        currentModeView = first.view;
        currentModeYear = first.year;
        return;
      }

      if (activeColorModes.includes('reserved')) {
        currentColorMode = 'reserved';
        currentModeYear = 'reserved';
      }
    }

    function updateViewToggleLabelState(){
      if (!partyLabelEl || !allianceLabelEl || !viewToggleEl) return;
      const allianceActive = !!viewToggleEl.checked;
      partyLabelEl.classList.toggle('inactive', allianceActive);
      allianceLabelEl.classList.toggle('inactive', !allianceActive);
    }

    function updateViewToggleState(){
      if (!viewToggleEl || !viewToggleWrapEl) return;
      const isReserved = currentModeYear === 'reserved';
      const hasAlliance = hasMode('alliance', currentModeYear);
      const hasParty = hasMode('party', currentModeYear);
      const canToggle = !isReserved && hasAlliance && hasParty;

      if (!hasAlliance && hasParty) currentModeView = 'party';
      if (hasAlliance && !hasParty) currentModeView = 'alliance';

      viewToggleEl.checked = currentModeView === 'alliance';
      viewToggleEl.disabled = !canToggle;
      viewToggleWrapEl.style.opacity = canToggle ? '1' : '0.65';
      viewToggleWrapEl.style.pointerEvents = canToggle ? 'auto' : 'none';
      viewToggleWrapEl.style.visibility = isReserved ? 'hidden' : 'visible';
      updateViewToggleLabelState();
    }

    function renderYearTabs(){
      if (!yearTabsEl) return;

      const years = inferAvailableYears(activeColorModes);
      const hasReservedMode = activeColorModes.includes('reserved');
      yearTabsEl.innerHTML = '';

      for (const year of years) {
        const btn = document.createElement('button');
        btn.className = 'year-btn';
        btn.type = 'button';
        btn.dataset.modeYear = year;
        btn.textContent = year;
        btn.classList.toggle('active', currentModeYear === year);
        btn.addEventListener('click', () => {
          if (currentModeYear === year) return;
          currentModeYear = year;
          const nextMode = resolveModeForControls();
          if (!nextMode) return;
          currentColorMode = nextMode;
          syncControlsFromCurrentMode();
          renderYearTabs();
          updateViewToggleState();
          applyCurrentColorMode();
        });
        yearTabsEl.appendChild(btn);
      }

      if (hasReservedMode) {
        const reservedBtn = document.createElement('button');
        reservedBtn.className = 'year-btn';
        reservedBtn.type = 'button';
        reservedBtn.dataset.modeYear = 'reserved';
        reservedBtn.textContent = uiText().reserved;
        reservedBtn.classList.toggle('active', currentModeYear === 'reserved');
        reservedBtn.addEventListener('click', () => {
          if (currentModeYear === 'reserved' && currentColorMode === 'reserved') return;
          currentModeYear = 'reserved';
          currentColorMode = 'reserved';
          renderYearTabs();
          updateViewToggleState();
          applyCurrentColorMode();
        });
        yearTabsEl.appendChild(reservedBtn);
      }
    }

    function preComputeColors(){
      colorCache = new Map();
      for (const [acNo, row] of electionData) {
        for (const mode of activeColorModes) {
          const cacheKey = `${mode}_${acNo}`;
          let color = '#f3f4f6';
          switch(mode){
            case 'alliance-2026':
              color = get2026AllianceColor(row);
              break;
            case 'party-2026':
              color = get2026PartyColor(row);
              break;
            case 'alliance-2021':
            case 'alliance-2020':
              color = allianceColors.get(normalizeAllianceKey(rowAllianceForYear(row, 2021))) || '#f3f4f6';
              break;
            case 'party-2021':
            case 'party-2020':
              color = partyColors.get(rowPartyForYear(row, 2021)) || allianceColors.get(normalizeAllianceKey(rowAllianceForYear(row, 2021))) || '#f3f4f6';
              break;
            case 'alliance-2016':
              color = allianceColors.get(normalizeAllianceKey(row.y2016_winner_alliance))
                   || getHistoricalAllianceColor(row.y2016_winner_party, '2016');
              break;
            case 'party-2016':
              color = partyColors.get(row.y2016_winner_party)
                   || allianceColors.get(normalizeAllianceKey(row.y2016_winner_alliance))
                   || getHistoricalAllianceColor(row.y2016_winner_party, '2016');
              break;
            case 'alliance-2015':
              color = getHistoricalAllianceColor(row.y2015_winner_party, '2015');
              break;
            case 'party-2015':
              color = partyColors.get(row.y2015_winner_party) || getHistoricalAllianceColor(row.y2015_winner_party, '2015');
              break;
            case 'alliance-2010':
              color = getHistoricalAllianceColor(row.y2010_winner_party, '2010');
              break;
            case 'party-2010':
              color = partyColors.get(row.y2010_winner_party) || getHistoricalAllianceColor(row.y2010_winner_party, '2010');
              break;
            case 'reserved': {
              const status = (row.reserved || 'GEN').toUpperCase();
              const reservedColors = { GEN: '#f9fafb', SC: '#dbeafe', ST: '#dcfce7', NA: '#f3f4f6' };
              color = reservedColors[status] || reservedColors.GEN;
              break;
            }
          }
          colorCache.set(cacheKey, color);
        }
      }
    }

    function updateLegend(){
      if (!electionData.size || !activeColorModes.length) {
        legendEl.style.display = 'none';
        legendEl.innerHTML = '';
        return;
      }

      const mode = currentColorMode;
      let legendItems = [];

      if (mode === 'reserved') {
        const counts = new Map();
        for (const [, row] of electionData) {
          const s = String(row.reserved || 'GEN').toUpperCase();
          counts.set(s, (counts.get(s) || 0) + 1);
        }
        const reservedColors = { GEN: '#f9fafb', SC: '#dbeafe', ST: '#dcfce7', NA: '#f3f4f6' };
        legendItems = Array.from(counts.entries()).sort((a,b) => b[1]-a[1]).map(([status, count]) => ({
          color: reservedColors[status] || reservedColors.GEN,
          label: `${localizeReserved(status)} (${count})`
        }));
      } else if (mode.includes('alliance')) {
        const year = parseInt(mode.split('-')[1] || '2021', 10);
        const allianceCount = new Map();
        for (const [, row] of electionData) {
          if (year === 2026 && !isLive2026Row(row)) continue;
          let alliance = null;
          if (year === 2021 || year === 2020) alliance = rowAllianceForYear(row, 2021) || null;
          if (year === 2026) alliance = row.y2026_winner_alliance || null;
          if (year === 2016) alliance = row.y2016_winner_alliance || null;
          if (!alliance) {
            const party = (year === 2026) ? row.y2026_winner_party
                      : (year === 2016) ? row.y2016_winner_party
                      : (year === 2015) ? row.y2015_winner_party
                      : (year === 2010) ? row.y2010_winner_party
                      : rowPartyForYear(row, 2021);
            const info = partyData.get(party);
            const alliances = info && (info.alliances || null);
            alliance = (alliances && (alliances[String(year)] || alliances[year]))
                    || (info && (info[`alliance_${year}`] || info.alliance_2021 || info.alliance_2020 || info.alliance))
                    || rowAllianceForYear(row, 2021)
                    || 'NA';
          }
          allianceCount.set(alliance, (allianceCount.get(alliance) || 0) + 1);
        }
        legendItems = Array.from(allianceCount.entries()).sort((a,b)=> b[1]-a[1]).map(([a,count]) => ({
          color: (a === 'NA') ? '#e5e7eb' : (allianceColors.get(normalizeAllianceKey(a)) || '#e5e7eb'),
          label: `${a === 'NA' ? uiText().notAvailable : localizeText(a)} (${count})`
        }));
      } else if (mode.includes('party')) {
        const partyCount = new Map();
        for (const [, row] of electionData) {
          if (mode === 'party-2026' && !isLive2026Row(row)) continue;
          const party = mode === 'party-2026' ? row.y2026_winner_party
                     : mode === 'party-2021' || mode === 'party-2020' ? rowPartyForYear(row, 2021)
                     : mode === 'party-2016' ? row.y2016_winner_party
                     : mode === 'party-2015' ? row.y2015_winner_party
                     : mode === 'party-2010' ? row.y2010_winner_party : null;
          if (party) partyCount.set(party, (partyCount.get(party) || 0) + 1);
        }
        legendItems = Array.from(partyCount.entries())
          .sort((a,b) => b[1]-a[1])
          .slice(0, 6)
          .map(([party, count]) => ({ color: ensurePartyColor(party) || '#f3f4f6', label: `${localizeText(party)} (${count})` }));
      }

      if (!legendItems.length) {
        legendEl.style.display = 'none';
        legendEl.innerHTML = '';
        return;
      }

      legendEl.innerHTML = legendItems
        .map(item => `<span class="legend-chip"><span class="legend-swatch" style="background:${item.color};"></span>${item.label}</span>`)
        .join('');
      legendEl.style.display = 'flex';
    }

    function isLeadingBlink(acNo, mode){
      const row = electionData.get(acNo);
      if (!row) return false;
      const parsed = parseMode(mode);
      return parsed && parsed.year === '2026' && isLeadingStatus(row) && hasAny2026WinnerField(row);
    }

    function applyCurrentColorMode(){
      g.selectAll('path.ac').attr('fill', d => getFillForMode(featureKey(d.properties), currentColorMode));
      g.selectAll('path.ac').classed('leading-blink', d => isLeadingBlink(featureKey(d.properties), currentColorMode));
      if (selectedKey) {
        g.selectAll('path.ac').attr('stroke', d => {
          const key = featureKey(d.properties);
          return key === selectedKey ? selectedStrokeForKey(key) : '#1f77b4';
        });
      }
      updateLegend();
    }

    function configureColorModes(){
      if (!activeColorModes.length) {
        if (modeControlsRowEl) modeControlsRowEl.style.display = 'none';
        if (yearTabsEl) yearTabsEl.innerHTML = '';
        legendEl.style.display = 'none';
        return;
      }

      {
        const availableYears = inferAvailableYears(activeColorModes).sort();
        const latestYear = availableYears[availableYears.length - 1];
        if (latestYear) {
          const preferredMode = `${currentModeView}-${latestYear}`;
          currentColorMode = activeColorModes.includes(preferredMode) ? preferredMode
            : activeColorModes.includes(`alliance-${latestYear}`) ? `alliance-${latestYear}`
            : activeColorModes.includes(`party-${latestYear}`) ? `party-${latestYear}`
            : currentColorMode;
        }
        if (!activeColorModes.includes(currentColorMode)) {
          const firstPartyMode = activeColorModes.find((mode) => /^party-\d{4}$/.test(mode));
          currentColorMode = firstPartyMode || (activeColorModes.includes('reserved') ? 'reserved' : activeColorModes[0]);
        }
      }

      syncControlsFromCurrentMode();
      renderYearTabs();
      updateViewToggleState();

      if (modeControlsRowEl) {
        const hasYearModes = inferAvailableYears(activeColorModes).length > 0;
        const hasReservedMode = activeColorModes.includes('reserved');
        modeControlsRowEl.style.display = (hasYearModes || hasReservedMode) ? '' : 'none';
      }
    }

    function normalizeResultKey(row){
      const raw = row && (row.no ?? row.AC_NO ?? row.ac_no ?? row.ac ?? row.id ?? '');
      const digits = String(raw).match(/\d+/);
      if (digits && digits[0]) return digits[0].padStart(3, '0');
      return String(raw || '').trim().toUpperCase();
    }

    function normalizeSheetStateKey(value){
      const raw = String(value || '').trim().toUpperCase().replace(/[-\s]+/g, '_');
      if (!raw) return '';
      const compact = raw.replace(/_/g, '');
      const aliases = {
        TAMILNADU: 'TAMIL_NADU',
        TAMIL_NADU: 'TAMIL_NADU',
        KERALA: 'KERALA',
        WESTBENGAL: 'WEST_BENGAL',
        WEST_BENGAL: 'WEST_BENGAL',
        ASSAM: 'ASSAM',
        PUDUCHERRY: 'PUDUCHERRY',
        PONDICHERRY: 'PUDUCHERRY'
      };
      return aliases[raw] || aliases[compact] || raw;
    }

    function getStateKeyFromRow(row){
      return normalizeSheetStateKey(
        row && (
          row.state_key ??
          row.state ??
          row.state_name ??
          row.State ??
          row.STATE ??
          row.STATE_KEY ??
          row.STATE_NAME
        )
      );
    }

    function getRowsForState(rows, stateKey){
      if (!Array.isArray(rows) || !rows.length) return [];
      const normalized = normalizeStateKey(stateKey);
      const rowsWithState = rows.filter(r => getStateKeyFromRow(r));
      if (!rowsWithState.length) return rows;
      return rows.filter(r => {
        const rowState = getStateKeyFromRow(r);
        return !rowState || rowState === normalized;
      });
    }

    function extractYearFromAllianceColumn(columnName){
      const key = String(columnName || '').trim().toLowerCase().replace(/\s+/g, '_');
      let match = key.match(/alliance[_-]?(\d{4})/);
      if (match && match[1]) return match[1];
      match = key.match(/(\d{4})[_-]?alliance/);
      if (match && match[1]) return match[1];
      return '';
    }

    function parsePartyAllianceMappingRows(rows, stateKey){
      const out = new Map();
      const normalizedState = normalizeStateKey(stateKey);
      for (const row of (rows || [])) {
        const rowState = getStateKeyFromRow(row);
        if (rowState && rowState !== normalizedState) continue;

        const party = String(
          row.party_code ??
          row.party ??
          row.PARTY_CODE ??
          row.PARTY ??
          row.code ??
          row.Code ??
          ''
        ).trim();
        if (!party) continue;

        const existing = out.get(party) || { alliances: {}, defaultAlliance: '' };
        const allianceRaw = String(
          row.alliance ??
          row.ALLIANCE ??
          row.alliance_name ??
          row.ALLIANCE_NAME ??
          ''
        ).trim();
        const yearRaw = String(row.year ?? row.YEAR ?? '').trim();

        if (yearRaw && allianceRaw) {
          existing.alliances[yearRaw] = allianceRaw;
        } else if (allianceRaw) {
          existing.defaultAlliance = allianceRaw;
        }

        for (const [key, value] of Object.entries(row || {})) {
          const year = extractYearFromAllianceColumn(key);
          const alliance = String(value || '').trim();
          if (!year || !alliance) continue;
          existing.alliances[year] = alliance;
        }
        out.set(party, existing);
      }
      return out;
    }

    function mergePartyAllianceMaps(staticMap, liveMap){
      const out = new Map();
      const applyOne = (sourceMap) => {
        if (!(sourceMap instanceof Map)) return;
        for (const [party, entry] of sourceMap.entries()) {
          if (!party) continue;
          const existing = out.get(party) || { alliances: {}, defaultAlliance: '' };
          const incoming = entry || { alliances: {}, defaultAlliance: '' };
          const merged = {
            alliances: { ...(existing.alliances || {}), ...(incoming.alliances || {}) },
            defaultAlliance: incoming.defaultAlliance || existing.defaultAlliance || ''
          };
          out.set(party, merged);
        }
      };
      applyOne(staticMap);
      applyOne(liveMap);
      return out;
    }

    function pickRowValue(row, keys){
      for (const key of keys) {
        if (!Object.prototype.hasOwnProperty.call(row || {}, key)) continue;
        const value = String(row[key] ?? '').trim();
        if (value) return value;
      }
      return '';
    }

    function extractYearFromAllianceKey(columnName){
      const key = String(columnName || '').trim().toLowerCase().replace(/\s+/g, '_');
      let match = key.match(/^alliance[_-]?(\d{4})$/);
      if (match && match[1]) return match[1];
      match = key.match(/^(\d{4})[_-]?alliance$/);
      if (match && match[1]) return match[1];
      return '';
    }

    function parsePartiesFromRows(rows, stateKey){
      const out = new Map();
      for (const row of getRowsForState(rows || [], stateKey)) {
        const code = pickRowValue(row, ['party_code', 'party', 'code', 'PARTY_CODE', 'PARTY', 'CODE']);
        if (!code) continue;
        const existing = out.get(code) || { code, name: code, color: '', alliances: {} };
        const next = { ...existing };
        const name = pickRowValue(row, ['party_name', 'name', 'party', 'PARTY_NAME', 'NAME']);
        if (name) next.name = name;
        const color = pickRowValue(row, ['color', 'party_color', 'PARTY_COLOR', 'COLOR']);
        if (color) next.color = color;
        const alliance = pickRowValue(row, ['alliance', 'ALLIANCE']);
        if (alliance) next.alliance = alliance;
        const allianceColor = pickRowValue(row, ['alliance_color', 'alliance_colour', 'alliance_colour_code', 'ALLIANCE_COLOR']);
        if (allianceColor) next.alliance_color = allianceColor;
        const alliances = { ...(next.alliances || {}) };
        for (const [key, value] of Object.entries(row || {})) {
          const year = extractYearFromAllianceKey(key);
          const allianceForYear = String(value || '').trim();
          if (!year || !allianceForYear) continue;
          alliances[year] = allianceForYear;
        }
        const alliance2021 = pickRowValue(row, ['alliance_2021', 'ALLIANCE_2021']);
        const alliance2020 = pickRowValue(row, ['alliance_2020', 'ALLIANCE_2020']);
        if (alliance2021 && !alliances['2021']) alliances['2021'] = alliance2021;
        if (alliance2020 && !alliances['2020']) alliances['2020'] = alliance2020;
        next.alliances = alliances;
        out.set(code, next);
      }
      return Array.from(out.values());
    }

    function parseAllianceColorsFromRows(rows, stateKey){
      const out = {};
      for (const row of getRowsForState(rows || [], stateKey)) {
        const alliance = pickRowValue(row, ['alliance', 'alliance_code', 'name', 'ALLIANCE', 'ALLIANCE_CODE', 'NAME', 'code', 'CODE']);
        const color = pickRowValue(row, ['color', 'hex', 'alliance_color', 'ALLIANCE_COLOR', 'COLOR']);
        if (!alliance || !color) continue;
        out[alliance] = color;
      }
      return out;
    }

    function parseI18nRows(rows){
      const strings = new Map();
      const reserved = {};
      for (const row of (rows || [])) {
        const key = pickRowValue(row, ['key', 'source', 'en', 'KEY', 'SOURCE', 'EN']);
        const kn = pickRowValue(row, ['kn', 'kannada', 'value', 'target', 'KN', 'KANNADA', 'VALUE', 'TARGET']);
        if (!key || !kn) continue;
        const type = pickRowValue(row, ['type', 'category', 'TYPE', 'CATEGORY']).toLowerCase();
        const isReserved = type === 'reserved' && ['GEN', 'SC', 'ST', 'NA'].includes(key.toUpperCase());
        if (isReserved) {
          reserved[key.toUpperCase()] = kn;
        } else {
          strings.set(key, kn);
        }
      }
      return { strings, reserved };
    }

    const PARTY_OVERLAY_FIELDS = [
      'y2026_winner_party',
      'y2026_winner_alliance',
      'y2021_winner_party',
      'y2021_winner_alliance',
      'y2016_winner_party',
      'y2016_winner_alliance',
      'current_mla_party',
      'current_mla_alliance',
      'y2015_winner_party',
      'y2010_winner_party'
    ];

    const LIVE_2026_RESULTS_FIELDS = [
      'y2026_winner_name',
      'y2026_winner_party',
      'y2026_winner_alliance',
      'status',
      'updated_at'
    ];

    const LIVE_2026_PARTY_FIELDS = [
      'y2026_winner_party',
      'y2026_winner_alliance'
    ];

    function mergeRowsByAc(resultRows, overlayRows, fields){
      const base = Array.isArray(resultRows) ? resultRows : [];
      const overlays = Array.isArray(overlayRows) ? overlayRows : [];
      if (!base.length || !overlays.length) return base;

      const byAc = new Map();
      for (const row of overlays) {
        const key = normalizeResultKey(row);
        if (!key) continue;
        byAc.set(key, row);
      }

      const fieldList = Array.isArray(fields) && fields.length ? fields : null;

      return base.map((row) => {
        const key = normalizeResultKey(row);
        const overlay = byAc.get(key);
        if (!overlay) return row;
        const merged = { ...row };
        const keysToMerge = fieldList || Object.keys(overlay);
        for (const field of keysToMerge) {
          if (!field) continue;
          const fieldKey = String(field).trim();
          if (!fieldKey || /^(no|ac_no|ac|id|state|state_key)$/i.test(fieldKey)) continue;
          const value = String(overlay[fieldKey] ?? '').trim();
          if (!value) continue;
          merged[fieldKey] = value;
        }
        return merged;
      });
    }

    function mergePartyWiseIntoResultsRows(resultRows, partyRows){
      return mergeRowsByAc(resultRows, partyRows, PARTY_OVERLAY_FIELDS);
    }

    function normalizeCellValue(value){
      if (value == null) return '';
      return String(value)
        .replace(/\u00a0/g, ' ')
        .replace(/\r\n?/g, '\n')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function normalizeCsvRows(rows){
      return (rows || []).map((row) => {
        const cleaned = {};
        for (const [rawKey, rawValue] of Object.entries(row || {})) {
          const key = normalizeCellValue(rawKey);
          if (!key) continue;
          const value = normalizeCellValue(rawValue);
          if (Object.prototype.hasOwnProperty.call(cleaned, key) && cleaned[key] && !value) continue;
          cleaned[key] = value;
        }
        return cleaned;
      });
    }

    async function loadCsv(url, description, optional = false, cacheMode = 'no-store'){
      try {
        const response = await fetch(url, { cache: cacheMode });
        if (!response.ok) throw new Error(`${description} HTTP ${response.status}`);
        const text = await response.text();
        return normalizeCsvRows(d3.csvParse(text));
      } catch (e) {
        if (optional) return null;
        throw e;
      }
    }

    if (!window.pvElectionCache) {
      window.pvElectionCache = (function() {
        const LS_PREFIX = 'pvElec_';
        const LS_TTL = 2 * 60 * 1000; // 2 minutes
        function lsKey(url) {
          try { return LS_PREFIX + btoa(url).slice(0, 80); } catch(e) { return null; }
        }
        return {
          mem: {},
          pending: {},
          get: function(url) {
            if (url in this.mem) return this.mem[url];
            const k = lsKey(url);
            if (!k) return undefined;
            try {
              const raw = localStorage.getItem(k);
              if (!raw) return undefined;
              const entry = JSON.parse(raw);
              if (Date.now() - entry.t < LS_TTL) { this.mem[url] = entry.d; return entry.d; }
              localStorage.removeItem(k);
            } catch(e) {}
            return undefined;
          },
          set: function(url, data) {
            this.mem[url] = data;
            const k = lsKey(url);
            if (!k) return;
            try { localStorage.setItem(k, JSON.stringify({ d: data, t: Date.now() })); } catch(e) {}
          }
        };
      })();
    }

    async function loadSheetValues(tabName, cacheMode = 'force-cache', stateFilter = '') {
      const url = buildLegacyCloudfrontValuesUrl(LEGACY_API_BASE_PARAM, SHEET_ID, tabName, LEGACY_API_KEY_PARAM);
      const useCache = cacheMode !== 'no-store';

      if (useCache) {
        const hit = window.pvElectionCache.get(url);
        if (hit !== undefined) return hit;
        if (window.pvElectionCache.pending[url]) return window.pvElectionCache.pending[url];
      }

      const doFetch = async () => {
        const res = await fetch(url, { cache: cacheMode });
        if (!res.ok) throw new Error(`Sheet API HTTP ${res.status}`);
        const json = await res.json();
        if (json.error) throw new Error(json.error);
        if (!json.values || json.values.length < 2) return [];
        const [headers, ...dataRows] = json.values;
        return normalizeCsvRows(dataRows.map(row => {
          const obj = {};
          headers.forEach((h, i) => { obj[h] = row[i] ?? ''; });
          return obj;
        }));
      };

      if (!useCache) return doFetch();

      const promise = doFetch().then(rows => {
        window.pvElectionCache.set(url, rows);
        delete window.pvElectionCache.pending[url];
        return rows;
      }).catch(e => {
        delete window.pvElectionCache.pending[url];
        throw e;
      });
      window.pvElectionCache.pending[url] = promise;
      return promise;
    }

    async function loadMultiSheetValues(requests, cacheMode = 'force-cache') {
      const filteredRequests = (requests || []).filter((request) => request && request.alias && request.tabName);
      if (!filteredRequests.length) return {};
      const entries = await Promise.all(filteredRequests.map(async (request) => {
        const rows = await loadSheetValues(request.tabName, cacheMode, request.stateFilter || '');
        return [request.alias, rows];
      }));
      return Object.fromEntries(entries);
    }

    async function loadJson(url, description, optional = false){
      try {
        // Cache map geometry aggressively; election CSVs still use no-store.
        const response = await fetch(url, { cache: 'force-cache' });
        if (!response.ok) throw new Error(`${description} HTTP ${response.status}`);
        return await response.json();
      } catch (e) {
        if (optional) return null;
        throw e;
      }
    }

    async function loadElectionDataForState(stateKey, cfg){
      resetElectionCaches();
      if (!SHEET_ID) throw new Error('Missing sheetId.');
      if (!LEGACY_API_BASE_PARAM || !LEGACY_API_KEY_PARAM) {
        throw new Error('Missing legacyApiBase or legacyApiKey.');
      }
      const staticMode = staticCsvCacheMode();

      if (_fullStaticCache) {
        // Full data already loaded in background — restore from it (no API call needed)
        cachedResultsRows   = _fullStaticCache.results;
        cachedPartyWiseRows = _fullStaticCache.partyWise;
        cachedMappingRows   = _fullStaticCache.mapping;
        cachedMappingLiveRows = _fullStaticCache.mappingLive;
        cachedPartyRows     = _fullStaticCache.parties;
        cachedAllianceRows  = _fullStaticCache.alliances;
      } else {
        // Phase 1: load all static tabs in parallel, filtered for current state
        const sf = stateKey;
        const separatePartyWise = PARTY_WISE_TAB_NAME && PARTY_WISE_TAB_NAME !== RESULTS_TAB_NAME;
        const staticRequests = [
          { alias: 'results', tabName: RESULTS_TAB_NAME, stateFilter: sf },
          { alias: 'mapping', tabName: MAPPING_TAB_NAME },
          { alias: 'mappingLive', tabName: MAPPING_LIVE_TAB_NAME || 'Live_Alliance_2026', stateFilter: sf },
          { alias: 'parties', tabName: PARTIES_TAB_NAME },
          { alias: 'alliances', tabName: ALLIANCES_TAB_NAME }
        ];
        if (separatePartyWise) {
          staticRequests.splice(1, 0, { alias: 'partyWise', tabName: PARTY_WISE_TAB_NAME, stateFilter: sf });
        }
        const staticRows = await loadMultiSheetValues(staticRequests, 'no-store');
        cachedResultsRows     = staticRows.results || null;
        cachedPartyWiseRows   = separatePartyWise ? (staticRows.partyWise || null) : cachedResultsRows;
        cachedMappingRows     = staticRows.mapping || null;
        cachedMappingLiveRows = staticRows.mappingLive || null;
        cachedPartyRows       = staticRows.parties || null;
        cachedAllianceRows    = staticRows.alliances || null;
        // Phase 2: load all states in background for instant future state switches
        _startFullStaticCacheLoad(staticMode);
      }

      // Live data always fetched fresh per state switch
      const liveLookup = RESULTS_LIVE_TAB_NAME || 'Live_Results_2026';
      const livePartyWiseLookup = PARTY_WISE_LIVE_TAB_NAME || liveLookup;
      const sameliveTabs = livePartyWiseLookup === liveLookup;
      const liveRequests = [{ alias: 'liveResults', tabName: liveLookup, stateFilter: stateKey }];
      if (!sameliveTabs) {
        liveRequests.push({ alias: 'livePartyWise', tabName: livePartyWiseLookup, stateFilter: stateKey });
      }
      const liveRows = await loadMultiSheetValues(liveRequests, 'no-store');
      const liveResultsRows = liveRows.liveResults || null;
      let livePartyWiseRows = sameliveTabs ? liveResultsRows : (liveRows.livePartyWise || null);

      const baseResultsData = getRowsForState(cachedResultsRows || [], stateKey);
      const liveResultsData = getRowsForState(liveResultsRows || [], stateKey);
      const staticPartyWiseData = getRowsForState(cachedPartyWiseRows || [], stateKey);
      const livePartyWiseData = getRowsForState(livePartyWiseRows || [], stateKey);
      const mergedResultsBase = baseResultsData.length
        ? mergeRowsByAc(baseResultsData, liveResultsData, LIVE_2026_RESULTS_FIELDS)
        : liveResultsData;
      const partyWiseData = staticPartyWiseData.length
        ? mergeRowsByAc(staticPartyWiseData, livePartyWiseData, LIVE_2026_PARTY_FIELDS)
        : livePartyWiseData;
      const resultsData = mergePartyWiseIntoResultsRows(mergedResultsBase, partyWiseData);
      const staticAllianceMap = parsePartyAllianceMappingRows(cachedMappingRows || [], stateKey);
      const liveAllianceMap = parsePartyAllianceMappingRows(cachedMappingLiveRows || [], stateKey);
      const allianceMap = mergePartyAllianceMaps(staticAllianceMap, liveAllianceMap);
      const partiesData = parsePartiesFromRows(cachedPartyRows || [], stateKey);
      const alliancesOverride = parseAllianceColorsFromRows(cachedAllianceRows || [], stateKey);

      if (!Array.isArray(resultsData) || !resultsData.length) {
        return false;
      }

      buildAllianceColors(Array.isArray(partiesData) ? partiesData : [], alliancesOverride || null);

      if (Array.isArray(partiesData)) {
        for (const party of partiesData) {
          if (!party || !party.code) continue;
          const basePartyColor = isValidHexColor(to6Hex(party.color || '')) ? to6Hex(party.color) : deterministicColorFor(party.code);
          partyColors.set(party.code, pastelizeColor(basePartyColor));
          const alliances = party.alliances || {};
          const a2021 = alliances['2021'] || alliances[2021] || alliances['2020'] || alliances[2020] || party.alliance_2021 || party.alliance_2020 || party.alliance;
          partyToAlliance.set(party.code, a2021);
          partyData.set(party.code, party);
          ensureAllianceColor(a2021, party.alliance_colour_code || party.alliance_color || party.color || basePartyColor);
        }
      }

      for (const [party, mapping] of allianceMap) {
        const existing = partyData.get(party) || { code: party };
        const existingAlliances = (existing.alliances && typeof existing.alliances === 'object') ? existing.alliances : {};
        const mergedAlliances = { ...existingAlliances, ...(mapping.alliances || {}) };
        const merged = { ...existing, alliances: mergedAlliances };
        if (mapping.defaultAlliance) merged.alliance = mapping.defaultAlliance;
        partyData.set(party, merged);
        if (!partyColors.has(party)) {
          partyColors.set(party, pastelizeColor(deterministicColorFor(party)));
        }
        const a2021 = mergedAlliances['2021'] || mergedAlliances[2021] || mergedAlliances['2020'] || mergedAlliances[2020] || merged.alliance || existing.alliance || '';
        if (a2021) {
          partyToAlliance.set(party, a2021);
          ensureAllianceColor(a2021, '');
        }
      }

      for (const row of resultsData) {
        const ac = normalizeResultKey(row);
        if (!ac) continue;
        const normalizedRow = { ...row };
        if (!normalizedRow.y2021_winner_name && normalizedRow.current_mla_name) normalizedRow.y2021_winner_name = normalizedRow.current_mla_name;
        if (!normalizedRow.y2021_winner_party && normalizedRow.current_mla_party) normalizedRow.y2021_winner_party = normalizedRow.current_mla_party;
        if (!normalizedRow.y2021_winner_alliance && normalizedRow.current_mla_alliance) normalizedRow.y2021_winner_alliance = normalizedRow.current_mla_alliance;
        if (!normalizedRow.current_mla_name && normalizedRow.y2021_winner_name) normalizedRow.current_mla_name = normalizedRow.y2021_winner_name;
        if (!normalizedRow.current_mla_party && normalizedRow.y2021_winner_party) normalizedRow.current_mla_party = normalizedRow.y2021_winner_party;
        if (!normalizedRow.current_mla_alliance && normalizedRow.y2021_winner_alliance) normalizedRow.current_mla_alliance = normalizedRow.y2021_winner_alliance;
        if (!normalizedRow.y2021_winner_alliance && normalizedRow.y2021_winner_party) {
          const resolved = resolveAllianceForYear(normalizedRow.y2021_winner_party, 2021);
          if (resolved && resolved !== 'NA') normalizedRow.y2021_winner_alliance = resolved;
        }
        if (!normalizedRow.current_mla_alliance && normalizedRow.current_mla_party) {
          const resolved = resolveAllianceForYear(normalizedRow.current_mla_party, 2021);
          if (resolved && resolved !== 'NA') normalizedRow.current_mla_alliance = resolved;
        }
        if (!normalizedRow.y2026_winner_alliance && normalizedRow.y2026_winner_party) {
          const resolved = resolveAllianceForYear(normalizedRow.y2026_winner_party, 2026);
          if (resolved && resolved !== 'NA') normalizedRow.y2026_winner_alliance = resolved;
        }
        if (!normalizedRow.y2016_winner_alliance && normalizedRow.y2016_winner_party) {
          const resolved = resolveAllianceForYear(normalizedRow.y2016_winner_party, 2016);
          if (resolved && resolved !== 'NA') normalizedRow.y2016_winner_alliance = resolved;
        }
        electionData.set(ac, normalizedRow);
      }

      activeColorModes = inferColorModes(resultsData);
      if (!activeColorModes.length) return false;

      preComputeColors();
      return electionData.size > 0;
    }

    async function refreshCurrentStateLiveData() {
      if (refreshInFlight || !currentState || !STATE_CONFIG[currentState]) return;
      refreshInFlight = true;
      try {
        await loadElectionDataForState(currentState, STATE_CONFIG[currentState]);
        applyCurrentColorMode();
        if (selectedKey && featureByKey.has(selectedKey)) {
          renderDetails(featureByKey.get(selectedKey));
        }
      } catch (e) {
        console.error('[map-widget] live refresh failed:', e);
      } finally {
        refreshInFlight = false;
      }
    }

    function _startFullStaticCacheLoad(staticMode) {
      if (_fullStaticCachePromise) return;
      // Only re-fetch tabs that had stateFilter (results, mappingLive).
      // Global tabs (mapping, parties, alliances) are already in browser cache from Phase 1
      // and already assigned to cachedXxx vars — reuse them directly.
      _fullStaticCachePromise = loadMultiSheetValues([
        { alias: 'results', tabName: RESULTS_TAB_NAME },
        { alias: 'mappingLive', tabName: MAPPING_LIVE_TAB_NAME || 'Live_Alliance_2026' }
      ], 'no-store').then(function(rows) {
        const results = rows.results || null;
        const mappingLive = rows.mappingLive || null;
        if (results) {
          _fullStaticCache = {
            results,
            partyWise: results,
            mapping: cachedMappingRows,
            mappingLive: mappingLive || cachedMappingLiveRows,
            parties: cachedPartyRows,
            alliances: cachedAllianceRows
          };
        }
      }).catch(function() {});
    }

    function updateCrossButton(){
      const transform = d3.zoomTransform(svg.node());
      const isZoomed = transform.k > 1.01;
      const isSelected = selectedKey !== null;
      crossBtn.style.display = (isZoomed || isSelected) ? 'block' : 'none';
    }

    const zoomViewportExtent = [[0, 0], [mapWidth, mapHeight]];
    const zoom = d3.zoom()
      .scaleExtent([1, 20])
      .extent(zoomViewportExtent)
      .translateExtent(zoomViewportExtent)
      .filter((ev) => {
        const type = String(ev.type || '');
        if (type === 'wheel') return ev.ctrlKey || ev.metaKey;
        if (type.startsWith('touch')) return true;
        return !ev.button;
      })
      .on('zoom', (ev) => {
        g.attr('transform', ev.transform);
        updateCrossButton();
      });
    svg.call(zoom);
    updateMapInteractionOverlay();
    svg.node().addEventListener('wheel', (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) showScrollHint();
    }, { passive: true });

    function draw(features){
      g.selectAll('path.ac')
        .data(features, d => featureKey(d.properties))
        .join('path')
        .attr('class', 'ac')
        .attr('data-key', d => featureKey(d.properties))
        .attr('d', d => path(d))
        .attr('fill', d => getFillForMode(featureKey(d.properties), currentColorMode))
        .classed('leading-blink', d => isLeadingBlink(featureKey(d.properties), currentColorMode))
        .attr('stroke', '#1f77b4')
        .on('mouseenter', (ev, d) => showTooltip(ev, d))
        .on('mousemove', (ev) => moveTooltip(ev))
        .on('mouseleave', () => hideTooltip())
        .on('click', (_, d) => selectByKey(featureKey(d.properties)));
    }

    function renderDistrictGroups(features){
      const shouldRender = currentState === 'PUDUCHERRY' && Array.isArray(features) && features.length && path;
      const overlay = g.selectAll('g.district-groups')
        .data(shouldRender ? [null] : [])
        .join(
          enter => enter.append('g').attr('class', 'district-groups').style('pointer-events', 'none'),
          update => update,
          exit => exit.remove()
        );
      if (!shouldRender || !overlay.node()) return;

      const pad = 10;
      const groups = Array.from(d3.group(features, f => featureDistrict(f.properties) || 'Unknown'), ([district, items]) => {
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        items.forEach(feature => {
          const bounds = path.bounds(feature);
          if (!Number.isFinite(bounds[0][0]) || !Number.isFinite(bounds[0][1]) || !Number.isFinite(bounds[1][0]) || !Number.isFinite(bounds[1][1])) return;
          x0 = Math.min(x0, bounds[0][0]);
          y0 = Math.min(y0, bounds[0][1]);
          x1 = Math.max(x1, bounds[1][0]);
          y1 = Math.max(y1, bounds[1][1]);
        });
        if (!Number.isFinite(x0) || !Number.isFinite(y0) || !Number.isFinite(x1) || !Number.isFinite(y1)) return null;
        return {
          district,
          x: x0 - pad,
          y: y0 - pad,
          width: (x1 - x0) + (pad * 2),
          height: (y1 - y0) + (pad * 2)
        };
      }).filter(Boolean);

      const districtGroups = overlay.selectAll('g.district-group')
        .data(groups, d => d.district)
        .join(
          enter => {
            const group = enter.append('g').attr('class', 'district-group');
            group.append('rect')
              .attr('rx', 8)
              .attr('ry', 8)
              .attr('fill', 'none')
              .attr('stroke', '#94a3b8')
              .attr('stroke-width', 1.5)
              .attr('stroke-dasharray', '6 4');
            return group;
          },
          update => update,
          exit => exit.remove()
        );
      districtGroups.attr('transform', d => `translate(${d.x},${d.y})`);
      districtGroups.select('rect')
        .attr('width', d => d.width)
        .attr('height', d => d.height);
    }

    function cacheFeatures(features){
      featureByKey.clear();
      for (const f of features) {
        featureByKey.set(featureKey(f.properties), f);
      }
    }

    function populateSearch(features){
      searchData = features.map(f => {
        const key = featureKey(f.properties);
        const name = featureName(f.properties);
        const dist = featureDistrict(f.properties);
        const localizedName = localizeText(name);
        const localizedDist = localizeText(dist);
        const label = `${localizedName || name}${localizedDist ? ` (${localizedDist})` : ''}`;
        return {
          key,
          name,
          dist,
          label,
          searchText: `${key} ${name} ${dist} ${localizedName} ${localizedDist}`.toLowerCase()
        };
      }).sort((a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }));
    }

    /* Change 4: Show "No results found" when query has no matches */
    function showDropdown(matches, query){
      if (!matches.length) {
        if (query && query.trim()) {
          dropdownEl.innerHTML = `<div class="dropdown-note">${uiText().noResultsFound}</div>`;
          dropdownEl.style.display = 'block';
        } else {
          dropdownEl.style.display = 'none';
        }
        return;
      }
      dropdownEl.innerHTML = '';
      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'dropdown-item';
        div.textContent = item.label;
        div.addEventListener('click', () => {
          searchEl.value = item.label;
          selectByKey(item.key);
          dropdownEl.style.display = 'none';
        });
        dropdownEl.appendChild(div);
      });
      dropdownEl.style.display = 'block';
    }

    /* Change 5: Richer tooltip — AC key · name · district */
    function showTooltip(ev, feature){
      if (!tooltipEl || selectedKey) return;
      const props = (feature && feature.properties) || {};
      const key = featureKey(props);
      const name = localizeText(featureName(props));
      const dist = localizeText(featureDistrict(props));
      tooltipEl.textContent = `AC ${key} · ${name || uiText().notAvailable}${dist ? ' · ' + dist : ''}`;
      tooltipEl.style.opacity = '1';
      tooltipEl.style.left = `${ev.clientX}px`;
      tooltipEl.style.top = `${ev.clientY - 8}px`;
    }

    function moveTooltip(ev){
      if (!tooltipEl || tooltipEl.style.opacity !== '1') return;
      tooltipEl.style.left = `${ev.clientX}px`;
      tooltipEl.style.top = `${ev.clientY - 8}px`;
    }

    function hideTooltip(){
      if (!tooltipEl) return;
      tooltipEl.style.opacity = '0';
    }

    function filterMatches(rawQuery){
      const query = String(rawQuery || '').trim().toLowerCase();
      if (!query) return searchData;
      return searchData.filter(item => item.searchText.includes(query));
    }

    function hideDropdown(){
      setTimeout(() => {
        dropdownEl.style.display = 'none';
      }, 120);
    }

    function fitToFeature(feature){
      if (!feature || !path) return;
      const b = path.bounds(feature);
      const dx = b[1][0] - b[0][0];
      const dy = b[1][1] - b[0][1];
      if (!Number.isFinite(dx) || !Number.isFinite(dy) || dx <= 0 || dy <= 0) return;
      const cx = (b[0][0] + b[1][0]) / 2;
      const cy = (b[0][1] + b[1][1]) / 2;
      const scale = Math.max(1, 0.9 / Math.max(dx / mapWidth, dy / mapHeight));
      const transform = d3.zoomIdentity.translate(mapWidth / 2, mapHeight / 2).scale(scale).translate(-cx, -cy);
      svg.transition().duration(650).call(zoom.transform, transform);
    }

    function renderDetails(feature){
      const props = feature.properties || {};
      const key = featureKey(props);
      const name = featureName(props);
      const district = featureDistrict(props);
      const stateLabel = localizedStateLabel(currentState);
      const row = electionData.get(key);
      const text = uiText();
      const displayName = localizeText(name) || text.unknownConstituency;
      const displayDistrict = localizeText(district) || stateLabel;

      let content = `
        <div class="sheet-header">
          <span class="ac-number">AC ${key}</span>
          <span class="ac-name">${displayName}</span>
          <span class="district-name">${displayDistrict}</span>
        </div>
      `;

      if (row) {
        let label = text.winner(2021);
        let person = rowNameForYear(row, 2021);
        let party = rowPartyForYear(row, 2021);
        let alliance = rowAllianceForYear(row, 2021);
        let year = 2021;

        if (currentColorMode.includes('2026')) {
          label = text.winner(2026);
          person = row.y2026_winner_name || person;
          party = row.y2026_winner_party || party;
          // In 2026 mode, do not inherit 2021 alliance directly.
          // Keep it 2026-only (or resolved via mapping) so UI matches map coloring.
          alliance = row.y2026_winner_alliance || '';
          year = 2026;
          const statusRaw = String(row.status || '').trim().toUpperCase();
          if (statusRaw === 'LEADING') {
            label = 'Leading (2026)';
          } else if (statusRaw === 'DECLARED') {
            label = 'Declared (2026)';
          }
        } else if (currentColorMode.includes('2016')) {
          label = text.winner(2016);
          person = row.y2016_winner_name || person;
          party = row.y2016_winner_party || party;
          alliance = row.y2016_winner_alliance || alliance;
          year = 2016;
        } else if (currentColorMode.includes('2015')) {
          label = text.winner(2015);
          person = row.y2015_winner_name || person;
          party = row.y2015_winner_party || party;
          year = 2015;
        } else if (currentColorMode.includes('2010')) {
          label = text.winner(2010);
          person = row.y2010_winner_name || person;
          party = row.y2010_winner_party || party;
          year = 2010;
        } else if (currentColorMode === 'reserved') {
          label = text.winner(2021);
          year = 2021;
        }

        if (!alliance || (year !== 2021 && year !== 2016 && year !== 2026)) {
          const resolved = resolveAllianceForYear(party, year);
          alliance = (resolved && resolved !== 'NA')
            ? resolved
            : (year === 2026 ? (row.y2026_winner_alliance || '')
            : (year === 2016 ? (row.y2016_winner_alliance || '') : rowAllianceForYear(row, 2021)));
        }

        const partyColor = partyColors.get(party) || '#f3f4f6';
        const allianceColor = allianceColors.get(normalizeAllianceKey(alliance)) || '#f3f4f6';
        const reserved = row.reserved ? String(row.reserved).toUpperCase() : null;
        const displayPerson = localizedValue(person, 'notAvailable');
        const displayParty = localizedValue(party, 'unknown');
        const displayAlliance = localizedValue(alliance, 'unknown');

        content += `<div class="info-band">`;
        content += `<span class="info-chip"><strong>${label}:</strong> ${displayPerson}</span>`;
        content += `<span class="info-chip"><strong>${text.party}:</strong> <span class="swatch" style="background:${partyColor};"></span>${displayParty}</span>`;
        content += `<span class="info-chip"><strong>${text.alliance}:</strong> <span class="swatch" style="background:${allianceColor};"></span>${displayAlliance}</span>`;
        if (reserved) {
          content += `<span class="info-chip"><strong>${text.reserved}:</strong> ${localizeReserved(reserved)}</span>`;
        }
        content += `</div>`;
      } else {
        content += `<div class="info-band" style="color:#6b7280;font-style:italic;">${text.noElectionData}</div>`;
      }

      bottomSheetEl.innerHTML = content;
      bottomSheetEl.style.display = 'block';
      document.body.classList.add('bottom-sheet-active');
    }

    function clearSelection(resetZoom = true){
      selectedKey = null;
      hideTooltip();
      g.selectAll('path.ac')
        .classed('selected', false)
        .classed('dimmed', false)
        .classed('no-hover', false)
        .attr('stroke', '#1f77b4');
      if (resetZoom) {
        svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity);
      }
      bottomSheetEl.style.display = 'none';
      document.body.classList.remove('bottom-sheet-active');
      searchEl.value = '';
      dropdownEl.style.display = 'none';
      removeQueryParam('ac');
      removeQueryParam('name');
      updateCrossButton();
    }

    function selectByKey(key, suppressUrlUpdate = false){
      const feature = featureByKey.get(key);
      if (!feature) return;
      selectedKey = key;
      hideTooltip();
      g.selectAll('path.ac').classed('selected', d => featureKey(d.properties) === key);
      g.selectAll('path.ac').classed('dimmed', d => featureKey(d.properties) !== key);
      g.selectAll('path.ac').classed('no-hover', d => featureKey(d.properties) === key);
      g.selectAll('path.ac').attr('stroke', d => {
        const k = featureKey(d.properties);
        return k === key ? selectedStrokeForKey(k) : '#1f77b4';
      });
      fitToFeature(feature);
      renderDetails(feature);

      if (!suppressUrlUpdate) {
        const item = searchData.find(x => x.key === key);
        setQueryParam('ac', key);
        if (item && item.name) setQueryParam('name', item.name);
      }
      updateCrossButton();
    }

    async function loadText(url, description){
      // Cache map geometry aggressively; election CSVs still use no-store.
      const response = await fetch(url, { cache: 'force-cache' });
      if (!response.ok) throw new Error(`${description} HTTP ${response.status}`);
      return response.text();
    }

    function parseSvgPointPairs(pointsText){
      const nums = String(pointsText || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
      if (!nums || nums.length < 6) return [];
      const out = [];
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const x = Number(nums[i]);
        const y = Number(nums[i + 1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        out.push([x, y]);
      }
      return out;
    }

    function parseFeatureNoFromSvgPolygon(el, fallbackIndex){
      const candidates = [
        el.getAttribute('data-ac-no'),
        el.getAttribute('data-ac-key'),
        el.getAttribute('id')
      ];
      for (const candidate of candidates) {
        const m = String(candidate || '').match(/\d+/);
        if (m && m[0]) return parseInt(m[0], 10);
      }
      const titleEl = el.querySelector('title');
      const titleMatch = String(titleEl && titleEl.textContent ? titleEl.textContent : '').match(/\d+/);
      if (titleMatch && titleMatch[0]) return parseInt(titleMatch[0], 10);
      return fallbackIndex + 1;
    }

    function parseFeatureNameFromSvgPolygon(el, fallbackNo){
      const fromAttr = String(el.getAttribute('data-ac-name') || '').trim();
      if (fromAttr) return fromAttr;
      const titleEl = el.querySelector('title');
      const titleText = String(titleEl && titleEl.textContent ? titleEl.textContent : '').trim();
      if (titleText) {
        const m = titleText.match(/^\s*\d+\s+(.+?)(?:\s*-\s*.+)?\s*$/);
        if (m && m[1]) return m[1].trim();
      }
      return `AC ${fallbackNo}`;
    }

    function parseFeatureDistrictFromSvgPolygon(el){
      const fromAttr = String(el.getAttribute('data-district') || '').trim();
      if (fromAttr) return fromAttr;
      const titleEl = el.querySelector('title');
      const titleText = String(titleEl && titleEl.textContent ? titleEl.textContent : '').trim();
      if (!titleText) return '';
      const parts = titleText.split(/\s+-\s+/);
      return parts.length > 1 ? String(parts.slice(1).join(' - ')).trim() : '';
    }

    function buildFeaturesFromKeyedSvg(svgText){
      const parser = new DOMParser();
      const doc = parser.parseFromString(String(svgText || ''), 'image/svg+xml');
      const polygons = Array.from(doc.querySelectorAll('polygon'));
      const features = [];
      polygons.forEach((el, idx) => {
        const points = parseSvgPointPairs(el.getAttribute('points') || '');
        if (points.length < 3) return;
        const no = parseFeatureNoFromSvgPolygon(el, idx);
        const ring = points.slice();
        const first = ring[0];
        const last = ring[ring.length - 1];
        if (first[0] !== last[0] || first[1] !== last[1]) ring.push([first[0], first[1]]);
        features.push({
          type: 'Feature',
          properties: {
            AC_NO: no,
            AC_NAME: parseFeatureNameFromSvgPolygon(el, no),
            DIST_NAME: parseFeatureDistrictFromSvgPolygon(el)
          },
          geometry: {
            type: 'Polygon',
            coordinates: [ring]
          }
        });
      });
      features.sort((a, b) => {
        const ka = featureKey(a.properties);
        const kb = featureKey(b.properties);
        return ka.localeCompare(kb, undefined, { numeric: true, sensitivity: 'base' });
      });
      if (!features.length) throw new Error('SVG parse failed: no valid polygons found');
      return features;
    }

    async function loadState(stateKey){
      const normalizedState = normalizeStateKey(stateKey);
      const cfg = STATE_CONFIG[normalizedState];
      const stateLabel = localizedStateLabel(normalizedState);
      currentState = normalizedState;
      setMapHeadingForState(normalizedState);
      setActiveTab(normalizedState);
      setWidgetLoading(true);

      try {
        statusEl.textContent = uiText().loadingMap(stateLabel);
        selectedKey = null;
        searchEl.value = '';
        dropdownEl.style.display = 'none';
        bottomSheetEl.style.display = 'none';
        document.body.classList.remove('bottom-sheet-active');
        hideTooltip();
        // Clear previous state's map immediately so stale paths aren't visible during load
        g.selectAll('path.ac').remove();
        g.selectAll('g.district-groups').remove();
        legendEl.style.display = 'none';

        let geoData = null;
        if (cfg.mapType === 'svg') {
          const svgText = await loadText(cfg.svgUrl, `${cfg.label} SVG`);
          const features = buildFeaturesFromKeyedSvg(svgText);
          geoData = { type: 'FeatureCollection', features };
          currentReflectY = false;
        } else {
          geoData = await loadJson(cfg.geoUrl, `${cfg.label} GeoJSON`);
          currentReflectY = true;
        }
        if (!geoData || !Array.isArray(geoData.features) || !geoData.features.length) {
          throw new Error(`Invalid map data for ${cfg.label}`);
        }
        const hasElectionData = await loadElectionDataForState(normalizedState, cfg);

        currentGeoData = geoData;
        updateMapDimensions();
        // Use planar fitting for these source files; spherical fitting collapses them.
        projection = buildProjectionForState(normalizedState, currentGeoData);
        path = d3.geoPath(projection);

        draw(currentGeoData.features);
        renderDistrictGroups(currentGeoData.features);
        cacheFeatures(currentGeoData.features);
        populateSearch(currentGeoData.features);
        configureColorModes();
        if (!hasElectionData) {
          g.selectAll('path.ac').attr('fill', '#f3f4f6');
          legendEl.style.display = 'none';
        } else {
          applyCurrentColorMode();
        }

        svg.call(zoom.transform, d3.zoomIdentity);
        setQueryParam('state', normalizedState);
        statusEl.textContent = '';

        const initialAc = getQueryParam('ac');
        if (initialAc && featureByKey.has(initialAc)) {
          selectByKey(initialAc, true);
        } else {
          const initialName = (getQueryParam('name') || '').trim().toLowerCase();
          if (initialName) {
            const match = searchData.find(item => item.name.toLowerCase() === initialName || item.label.toLowerCase() === initialName);
            if (match) selectByKey(match.key, true);
          }
        }
        setWidgetLoading(false);
        postEmbedSize('map-loaded');
      } catch (e) {
        setWidgetLoading(false);
        statusEl.textContent = uiText().failedToLoad(stateLabel, e && e.message ? e.message : 'unknown error');
        if (modeControlsRowEl) modeControlsRowEl.style.display = 'none';
        legendEl.style.display = 'none';
      }
    }

    function bindSearch(){
      searchEl.addEventListener('input', () => {
        showDropdown(filterMatches(searchEl.value), searchEl.value);
      });

      searchEl.addEventListener('focus', () => {
        showDropdown(filterMatches(searchEl.value), searchEl.value);
      });

      searchEl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const matches = filterMatches(searchEl.value);
          if (matches.length) {
            searchEl.value = matches[0].label;
            selectByKey(matches[0].key);
            dropdownEl.style.display = 'none';
          }
        } else if (ev.key === 'Escape') {
          dropdownEl.style.display = 'none';
        }
      });

      searchEl.addEventListener('blur', hideDropdown);

      document.addEventListener('click', (ev) => {
        if (!dropdownEl.contains(ev.target) && ev.target !== searchEl) {
          dropdownEl.style.display = 'none';
        }
      });
    }

    function bindControls(){
      crossBtn.onclick = () => clearSelection(true);
      zoomInBtn.onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.3);
      zoomOutBtn.onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.3);
      if (viewToggleEl) {
        viewToggleEl.addEventListener('change', () => {
          currentModeView = viewToggleEl.checked ? 'alliance' : 'party';
          const nextMode = resolveModeForControls();
          if (!nextMode) {
            updateViewToggleState();
            return;
          }
          currentColorMode = nextMode;
          syncControlsFromCurrentMode();
          renderYearTabs();
          updateViewToggleState();
          applyCurrentColorMode();
        });
      }
    }

    window.addEventListener('resize', () => {
      if (!currentGeoData) return;
      if (resizeDebounce) clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(() => {
        updateMapDimensions();
        projection = buildProjectionForState(currentState, currentGeoData);
        path = d3.geoPath(projection);
        g.selectAll('path.ac').attr('d', d => path(d));
        renderDistrictGroups(currentGeoData.features);
        if (selectedKey && featureByKey.has(selectedKey)) {
          fitToFeature(featureByKey.get(selectedKey));
        } else {
          svg.call(zoom.transform, d3.zoomIdentity);
        }
      }, 120);
    });

    function fitWidgetToViewport() {
      const viewport = document.getElementById('widgetViewport');
      const root = document.getElementById('widgetScaleRoot');
      if (!viewport || !root) return;
      root.style.transform = 'scale(1)';
      const naturalHeight = Math.ceil(Math.max(root.scrollHeight, root.offsetHeight));
      const scale = naturalHeight > 500 ? (500 / naturalHeight) : 1;
      root.style.transform = `scale(${scale})`;
      viewport.style.height = '500px';
    }

    async function init(){
      await loadLanguageData(initialLangFromQuery());
      populateStateTabs();
      bindSearch();
      bindControls();
      updateMapDimensions();
      await loadState(initialStateFromQuery());
      if (REFRESH_MS > 0) {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(refreshCurrentStateLiveData, REFRESH_MS);
      }
    }

    function postEmbedSize(reason = 'manual') {
      try {
        fitWidgetToViewport();
        const root = document.getElementById('widgetViewport') || document.querySelector('main') || document.body;
        const height = Math.ceil(root.getBoundingClientRect().height);
        const width  = Math.ceil(root.getBoundingClientRect().width);
        parent.postMessage({ type: 'parliament-embed-size', height, width, reason }, '*');
      } catch (e) {}
    }
    try { new ResizeObserver(() => postEmbedSize('resize-observer')).observe(document.body); } catch (_) {}
    window.addEventListener('load',   () => postEmbedSize('load'));
    window.addEventListener('resize', () => postEmbedSize('window-resize'));
    window.addEventListener('beforeunload', () => {
      if (refreshTimer) clearInterval(refreshTimer);
    });
    setTimeout(() => postEmbedSize('init'), 0);

    init();
  </script>
</body>
</html>
