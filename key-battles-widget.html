<body class="bg-background text-on-background font-body">
  <main class="px-4 pt-6">

    <!-- Search bar -->
    <div class="mb-5 w-full">
      <div class="w-full flex items-center gap-2 bg-white border border-stone-200 rounded-xl px-4 py-2.5 shadow-sm">
        <span class="material-symbols-outlined text-stone-400 text-[20px]">search</span>
        <input
          id="search-input"
          type="text"
          placeholder="Search constituency, candidate or party…"
          class="flex-1 bg-transparent text-sm text-stone-700 placeholder-stone-400 outline-none font-body"
        />
      </div>
    </div>

    <!-- Card list: 3-col grid on md+, horizontal carousel on mobile -->
    <div
      id="list"
      class="
        flex overflow-x-auto snap-x snap-mandatory gap-4 pb-6 hide-scrollbar
        md:grid md:grid-cols-3 md:gap-6 md:overflow-visible md:snap-none
      "
    ></div>
  </main>

  <script>
    const QUERY = new URLSearchParams(location.search);

    const BATTLE_PARAM = (QUERY.get('battle') || QUERY.get('battleId') || '').trim();
    const VIEW_PARAM = (QUERY.get('view') || QUERY.get('phase') || 'auto').trim().toLowerCase();
    const DEFAULT_PUBLISHED_SHEET_KEY = '2PACX-1vQ36TTM8PshuA8ODBEDceUqhEiKyQ1BkNE-KG6S8WPy8LU2r6qOBLtSMNQhJP0jDSWCIZyJMTgx6x4A';
    const DEFAULT_TAB_NAME = 'Key_Battles';
    const DEFAULT_MAPPING_LIVE_TAB_NAME = 'Live_Alliance_2026';
    const DEFAULT_PARTIES_TAB_NAME = 'Party_Color';
    const DEFAULT_ALLIANCES_TAB_NAME = 'Alliance_Color';

    const SHEET_ID_PARAM = (QUERY.get('sheetId') || '').trim();
    const SHEET_URL_PARAM = (QUERY.get('sheetUrl') || '').trim();
    const PUBLISHED_URL_PARAM = (QUERY.get('publishedSheetUrl') || QUERY.get('publishedUrl') || '').trim();
    const PUBLISHED_KEY_PARAM = (QUERY.get('publishedKey') || DEFAULT_PUBLISHED_SHEET_KEY).trim();
    const TAB_NAME = (QUERY.get('tab') || QUERY.get('keyBattlesTab') || DEFAULT_TAB_NAME).trim();
    const MAPPING_LIVE_TAB_NAME = (QUERY.get('mappingLiveTab') || DEFAULT_MAPPING_LIVE_TAB_NAME).trim();
    const PARTIES_TAB_NAME = (QUERY.get('partiesTab') || DEFAULT_PARTIES_TAB_NAME).trim();
    const ALLIANCES_TAB_NAME = (QUERY.get('alliancesTab') || DEFAULT_ALLIANCES_TAB_NAME).trim();
    const CSV_URL_PARAM = (QUERY.get('csvUrl') || QUERY.get('keyBattlesCsvUrl') || '').trim();
    const GID_PARAM = (QUERY.get('gid') || QUERY.get('keyBattlesGid') || '').trim();
    const MAPPING_LIVE_CSV_URL_PARAM = (QUERY.get('mappingLiveCsvUrl') || '').trim();
    const MAPPING_LIVE_GID_PARAM = (QUERY.get('mappingLiveGid') || '').trim();
    const PARTIES_CSV_URL_PARAM = (QUERY.get('partiesCsvUrl') || '').trim();
    const ALLIANCES_CSV_URL_PARAM = (QUERY.get('alliancesCsvUrl') || '').trim();
    const PARTIES_GID_PARAM = (QUERY.get('partiesGid') || '').trim();
    const ALLIANCES_GID_PARAM = (QUERY.get('alliancesGid') || '').trim();

    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search-input');

    let allBattles = [];
    let PARTY_COLORS = new Map();
    let ALLIANCE_COLORS = new Map();

    // ── Data helpers (unchanged) ──────────────────────────────────────────────

    function normalizeHeaderKey(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');
    }

    function normalizeRows(rows) {
      return (rows || []).map((row) => {
        const out = {};
        Object.keys(row || {}).forEach((key) => {
          out[normalizeHeaderKey(key)] = String(row[key] == null ? '' : row[key]).trim();
        });
        return out;
      });
    }

    function extractGoogleSheetId(rawUrl) {
      const raw = String(rawUrl || '').trim();
      const match = raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match && match[1] ? match[1] : '';
    }

    function extractGooglePublishedSheetKey(rawUrl) {
      const raw = String(rawUrl || '').trim();
      const match = raw.match(/\/spreadsheets\/d\/e\/([a-zA-Z0-9-_]+)/);
      return match && match[1] ? match[1] : '';
    }

    function buildGoogleSheetCsvUrl(sheetId, tabName) {
      return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
    }

    function buildGooglePublishedCsvUrl(publishedKey, gid) {
      return `https://docs.google.com/spreadsheets/d/e/${encodeURIComponent(publishedKey)}/pub?gid=${encodeURIComponent(gid)}&single=true&output=csv`;
    }

    function buildGooglePublishedHtmlUrl(publishedKey) {
      return `https://docs.google.com/spreadsheets/d/e/${encodeURIComponent(publishedKey)}/pubhtml`;
    }

    function normalizeTabLookupKey(value) {
      return String(value || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
    }

    function parsePublishedSheetTabGids(html) {
      const out = new Map();
      const text = String(html || '');
      const regex = /items\.push\(\{name:\s*"([^"]+)"[\s\S]*?gid:\s*"(-?\d+)"/g;
      let match = null;
      while ((match = regex.exec(text)) !== null) {
        const key = normalizeTabLookupKey(match[1]);
        const gid = String(match[2] || '').trim();
        if (!key || !gid || out.has(key)) continue;
        out.set(key, gid);
      }
      return out;
    }

    function findPublishedTabGid(tabMap, names) {
      for (const name of (names || [])) {
        const key = normalizeTabLookupKey(name);
        if (!key) continue;
        const gid = tabMap.get(key);
        if (gid) return gid;
      }
      return '';
    }

    function slugify(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function parseVotes(value) {
      const raw = String(value == null ? '' : value).replace(/,/g, '').trim();
      if (!raw) return null;
      const n = Number(raw);
      return Number.isFinite(n) ? n : null;
    }

    function parseYear(value) {
      const raw = String(value || '').trim();
      const m = raw.match(/(19|20)\d{2}/);
      return m ? m[0] : '';
    }

    function normalizeHexColor(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const hex = raw.startsWith('#') ? raw : `#${raw}`;
      return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '';
    }

    function formatVotes(value) {
      const n = parseVotes(value);
      if (n == null) return String(value || '').trim() || '-';
      return n.toLocaleString('en-IN');
    }

    function resolveViewModeForBattle(battle) {
      if (VIEW_PARAM === 'before' || VIEW_PARAM === 'counting' || VIEW_PARAM === 'after') return VIEW_PARAM;
      const status = String((battle && battle.status) || '').trim().toLowerCase();
      if (status.includes('announced') || status.includes('declared') || status.includes('won')) return 'after';
      if (status.includes('counting') || status.includes('leading') || status.includes('trailing')) return 'counting';
      return 'before';
    }

    function firstNonEmpty(row, keys) {
      for (const key of (keys || [])) {
        const value = String((row && row[key]) || '').trim();
        if (value) return value;
      }
      return '';
    }

    function pickBattleId(row) {
      return firstNonEmpty(row, ['battle_id', 'battle', 'battle_key', 'slug', 'id']);
    }

    function pickConstituency(row) {
      return firstNonEmpty(row, ['constituency_name', 'constituency', 'ac_name', 'seat_name']);
    }

    function candidateFromRow(row) {
      return {
        name: firstNonEmpty(row, ['candidate_name', 'name']),
        photo: firstNonEmpty(row, ['candidate_photo', 'photo', 'photo_url', 'image']),
        party: firstNonEmpty(row, ['candidate_party', 'party']),
        alliance: '',
        votes: firstNonEmpty(row, ['candidate_votes', 'votes', 'vote_count']),
        rank: parseVotes(firstNonEmpty(row, ['lead_rank', 'rank', 'position']))
      };
    }

    function mappingKey(stateKey, partyCode, year) {
      return `${String(stateKey || '').trim().toUpperCase()}|${String(partyCode || '').trim().toUpperCase()}|${String(year || '').trim()}`;
    }

    function parseAllianceMappingRows(rows) {
      const byYear = new Map();
      const latestByParty = new Map();

      (rows || []).forEach((row) => {
        const state = firstNonEmpty(row, ['state_key', 'state']).toUpperCase();
        const party = firstNonEmpty(row, ['party_code', 'party']).toUpperCase();
        const alliance = firstNonEmpty(row, ['alliance', 'alliance_code']);
        const year = parseYear(firstNonEmpty(row, ['year'])) || '2026';
        if (!state || !party || !alliance) return;

        byYear.set(mappingKey(state, party, year), alliance);
        latestByParty.set(`${state}|${party}`, alliance);
      });

      return { byYear, latestByParty };
    }

    function resolveAllianceFromLiveMapping(mappingRows, state, party, year) {
      if (!mappingRows) return '';
      const s = String(state || '').trim().toUpperCase();
      const p = String(party || '').trim().toUpperCase();
      if (!s || !p) return '';

      const y = parseYear(year) || '2026';
      const exact = mappingRows.byYear.get(mappingKey(s, p, y));
      if (exact) return exact;

      return mappingRows.latestByParty.get(`${s}|${p}`) || '';
    }

    async function resolveCsvUrl(options = {}) {
      const {
        csvUrlParam = '',
        tabName = '',
        gidParam = '',
        fallbackTabNames = []
      } = options;

      if (csvUrlParam) return csvUrlParam;

      const sheetId = SHEET_ID_PARAM || extractGoogleSheetId(SHEET_URL_PARAM);
      if (sheetId) return buildGoogleSheetCsvUrl(sheetId, tabName);

      const publishedKey = PUBLISHED_KEY_PARAM || extractGooglePublishedSheetKey(PUBLISHED_URL_PARAM);
      if (!publishedKey) throw new Error('Missing source. Pass csvUrl, sheetId/sheetUrl, or publishedKey/publishedUrl.');

      const explicitGid = String(gidParam || '').match(/-?\d+/);
      if (explicitGid && explicitGid[0]) return buildGooglePublishedCsvUrl(publishedKey, explicitGid[0]);

      const response = await fetch(buildGooglePublishedHtmlUrl(publishedKey), { cache: 'no-store' });
      if (!response.ok) throw new Error(`Published sheet index HTTP ${response.status}`);
      const html = await response.text();
      const tabMap = parsePublishedSheetTabGids(html);
      const gid = findPublishedTabGid(tabMap, [tabName, ...(fallbackTabNames || [])]);
      if (!gid) throw new Error(`Tab "${tabName}" not found in published sheet`);
      return buildGooglePublishedCsvUrl(publishedKey, gid);
    }

    async function loadRows() {
      const csvUrl = await resolveCsvUrl({
        csvUrlParam: CSV_URL_PARAM,
        tabName: TAB_NAME,
        gidParam: GID_PARAM,
        fallbackTabNames: ['key_battles', 'key_battle']
      });
      const response = await fetch(csvUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Sheet CSV HTTP ${response.status}`);
      const text = await response.text();
      return normalizeRows(d3.csvParse(text));
    }

    async function loadLiveMappingRows() {
      const csvUrl = await resolveCsvUrl({
        csvUrlParam: MAPPING_LIVE_CSV_URL_PARAM,
        tabName: MAPPING_LIVE_TAB_NAME,
        gidParam: MAPPING_LIVE_GID_PARAM,
        fallbackTabNames: ['live_alliance_2026', 'statewise_live_alliance_2026']
      });
      const response = await fetch(csvUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Live alliance mapping CSV HTTP ${response.status}`);
      const text = await response.text();
      return normalizeRows(d3.csvParse(text));
    }

    async function loadPartyColorRows() {
      const csvUrl = await resolveCsvUrl({
        csvUrlParam: PARTIES_CSV_URL_PARAM,
        tabName: PARTIES_TAB_NAME,
        gidParam: PARTIES_GID_PARAM,
        fallbackTabNames: ['party_color', 'party_master']
      });
      const response = await fetch(csvUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Party color CSV HTTP ${response.status}`);
      const text = await response.text();
      return normalizeRows(d3.csvParse(text));
    }

    async function loadAllianceColorRows() {
      const csvUrl = await resolveCsvUrl({
        csvUrlParam: ALLIANCES_CSV_URL_PARAM,
        tabName: ALLIANCES_TAB_NAME,
        gidParam: ALLIANCES_GID_PARAM,
        fallbackTabNames: ['alliance_color', 'alliance_master']
      });
      const response = await fetch(csvUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Alliance color CSV HTTP ${response.status}`);
      const text = await response.text();
      return normalizeRows(d3.csvParse(text));
    }

    function parsePartyColors(rows) {
      const out = new Map();
      (rows || []).forEach((row) => {
        const code = firstNonEmpty(row, ['party_code', 'party', 'code', 'name']).toUpperCase();
        const color = normalizeHexColor(firstNonEmpty(row, ['color', 'party_color']));
        if (!code || !color) return;
        out.set(code, color);
      });
      return out;
    }

    function parseAllianceColors(rows) {
      const out = new Map();
      (rows || []).forEach((row) => {
        const code = firstNonEmpty(row, ['alliance', 'alliance_code', 'name']).toUpperCase();
        const color = normalizeHexColor(firstNonEmpty(row, ['color', 'alliance_color']));
        if (!code || !color) return;
        out.set(code, color);
      });
      return out;
    }

    function buildBattles(rows, liveAllianceMapping) {
      const grouped = new Map();

      (rows || []).forEach((row) => {
        const state = firstNonEmpty(row, ['state_key', 'state']);
        const constituency = pickConstituency(row);
        const fallbackId = slugify(`${state}-${constituency}`);
        const battleId = slugify(pickBattleId(row) || fallbackId);
        if (!battleId) return;

        if (!grouped.has(battleId)) {
          grouped.set(battleId, {
            id: battleId,
            rawId: pickBattleId(row) || battleId,
            constituency: constituency || 'Unknown Constituency',
            state: firstNonEmpty(row, ['state_key', 'state']),
            acNo: firstNonEmpty(row, ['ac_no', 'no', 'ac']),
            status: firstNonEmpty(row, ['status']),
            resultDay: firstNonEmpty(row, ['result_day', 'result_date', 'updated_at']),
            storyUrl: firstNonEmpty(row, ['story_url', 'cta_url', 'url', 'story_page']),
            mapUrl: firstNonEmpty(row, ['map_url', 'map_widget_url']),
            mapState: firstNonEmpty(row, ['map_state']),
            mapAc: firstNonEmpty(row, ['map_ac']),
            mapName: firstNonEmpty(row, ['map_name']),
            candidates: []
          });
        }

        const battle = grouped.get(battleId);
        const cand = candidateFromRow(row);
        cand.alliance = resolveAllianceFromLiveMapping(
          liveAllianceMapping,
          battle.state || firstNonEmpty(row, ['state_key', 'state']),
          cand.party,
          firstNonEmpty(row, ['year']) || '2026'
        );
        if (cand.name || cand.party || cand.alliance || String(cand.votes || '').trim()) {
          battle.candidates.push(cand);
        }
      });

      const battles = Array.from(grouped.values()).map((battle) => {
        const mode = resolveViewModeForBattle(battle);
        const scored = battle.candidates.map((cand) => ({
          ...cand,
          votesNum: parseVotes(cand.votes)
        }));

        const hasRank = scored.some((c) => Number.isFinite(c.rank) && c.rank > 0);
        scored.sort((a, b) => {
          if (mode === 'before' && hasRank) {
            const ar = Number.isFinite(a.rank) && a.rank > 0 ? a.rank : 999;
            const br = Number.isFinite(b.rank) && b.rank > 0 ? b.rank : 999;
            if (ar !== br) return ar - br;
          }
          const av = Number.isFinite(a.votesNum) ? a.votesNum : -1;
          const bv = Number.isFinite(b.votesNum) ? b.votesNum : -1;
          if (av !== bv) return bv - av;
          return String(a.name || '').localeCompare(String(b.name || ''));
        });

        battle.candidates = scored.slice(0, 3);
        return battle;
      });

      battles.sort((a, b) =>
        String(a.state || '').localeCompare(String(b.state || ''))
        || String(a.constituency || '').localeCompare(String(b.constituency || ''))
      );
      return battles;
    }

    // ── UI helpers ────────────────────────────────────────────────────────────

    function textColorForHex(hex) {
      const c = normalizeHexColor(hex);
      if (!c) return '#57534e';
      const r = parseInt(c.slice(1, 3), 16);
      const g = parseInt(c.slice(3, 5), 16);
      const b = parseInt(c.slice(5, 7), 16);
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return yiq >= 150 ? '#1f2937' : '#f8fafc';
    }

    function mixHexWithWhite(hex, whiteRatio) {
      const c = normalizeHexColor(hex);
      if (!c) return '';
      const ratio = Math.max(0, Math.min(1, Number(whiteRatio)));
      const r = parseInt(c.slice(1, 3), 16);
      const g = parseInt(c.slice(3, 5), 16);
      const b = parseInt(c.slice(5, 7), 16);
      const rr = Math.round(r + (255 - r) * ratio);
      const gg = Math.round(g + (255 - g) * ratio);
      const bb = Math.round(b + (255 - b) * ratio);
      return `#${rr.toString(16).padStart(2, '0')}${gg.toString(16).padStart(2, '0')}${bb.toString(16).padStart(2, '0')}`;
    }

    function darkenHex(hex, factor) {
      const c = normalizeHexColor(hex);
      if (!c) return '';
      const f = Math.max(0, Math.min(1, Number(factor)));
      const r = Math.round(parseInt(c.slice(1, 3), 16) * f);
      const g = Math.round(parseInt(c.slice(3, 5), 16) * f);
      const b = Math.round(parseInt(c.slice(5, 7), 16) * f);
      return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }

    function applyChipColor(el, colorHex, fallbackBg = '#f5f5f4', fallbackText = '#57534e') {
      const color = normalizeHexColor(colorHex);
      if (color) {
        const bg = mixHexWithWhite(color, 0.84);
        const fg = darkenHex(color, 0.58);
        el.style.backgroundColor = bg || color;
        el.style.color = fg || textColorForHex(color);
        el.style.border = `1px solid ${mixHexWithWhite(color, 0.68) || 'rgba(0,0,0,0.08)'}`;
        return;
      }
      el.style.backgroundColor = fallbackBg;
      el.style.color = fallbackText;
      el.style.border = '1px solid rgba(0,0,0,0.08)';
    }

    function partyColorFromSheet(party) {
      const key = String(party || '').trim().toUpperCase();
      return key ? (PARTY_COLORS.get(key) || '') : '';
    }

    function allianceColorFromSheet(alliance) {
      const key = String(alliance || '').trim().toUpperCase();
      return key ? (ALLIANCE_COLORS.get(key) || '') : '';
    }

    function winnerOutcomeLabel(mode) {
      if (mode === 'after') return 'Won';
      if (mode === 'counting') return 'Leading';
      return null;
    }

    function challengerOutcomeLabel(mode) {
      if (mode === 'after') return 'Lost';
      if (mode === 'counting') return 'Trailing';
      return null;
    }

    function candidateVoteShare(cand, totalVotes) {
      if (!cand || !Number.isFinite(cand.votesNum) || !Number.isFinite(totalVotes) || totalVotes <= 0) return null;
      return (cand.votesNum / totalVotes) * 100;
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return null;
      return `${value.toFixed(1)}%`;
    }

    function makeAvatar(photoUrl, name, sizeClasses) {
      const url = String(photoUrl || '').trim();
      if (url) {
        const img = document.createElement('img');
        img.className = `${sizeClasses} rounded-full object-cover bg-stone-100 shrink-0`;
        img.alt = name ? `${name} photo` : 'Candidate photo';
        img.src = url;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => {
          const fb = makeFallbackAvatar(name, sizeClasses);
          img.replaceWith(fb);
        };
        return img;
      }
      return makeFallbackAvatar(name, sizeClasses);
    }

    function makeFallbackAvatar(name, sizeClasses) {
      const div = document.createElement('div');
      div.className = `${sizeClasses} rounded-full bg-stone-200 flex items-center justify-center text-stone-500 font-bold shrink-0`;
      div.textContent = name ? name.trim()[0].toUpperCase() : '?';
      return div;
    }

    function makeVoteShareBar(share, barColorClass, labelText, valueText, animate) {
      const wrap = document.createElement('div');
      wrap.className = 'w-full mt-2';
      const row = document.createElement('div');
      row.className = 'flex justify-between text-xs text-stone-400 mb-1';
      const label = document.createElement('span');
      label.textContent = labelText || 'Vote Share';
      const pct = document.createElement('span');
      pct.className = 'font-semibold text-stone-600';
      pct.textContent = valueText || formatPercent(share);
      row.appendChild(label);
      row.appendChild(pct);
      wrap.appendChild(row);
      const track = document.createElement('div');
      track.className = 'h-1.5 rounded-full bg-stone-200 w-full';
      const fill = document.createElement('div');
      const barW = `${Math.max(2, Math.min(100, share))}%`;
      fill.className = `h-full rounded-full ${barColorClass}${animate ? ' bar-counting' : ''}`;
      fill.style.setProperty('--bar-w', barW);
      if (!animate) fill.style.width = barW;
      track.appendChild(fill);
      wrap.appendChild(track);
      return wrap;
    }

    function metricLabelAndValue(mode, cand, share) {
      if (mode === 'counting') {
        return {
          label: 'Votes',
          value: formatVotes(cand && cand.votes)
        };
      }
      if (mode === 'after') {
        const pct = formatPercent(share);
        const votes = formatVotes(cand && cand.votes);
        return {
          label: 'Vote Share',
          value: `${pct || '-'} (${votes})`
        };
      }
      return {
        label: 'Vote Share',
        value: formatPercent(share)
      };
    }

    // ── Card renderers ────────────────────────────────────────────────────────

    function renderCandidateSection(cand, isHero, outcomeLabelText, showVoteShare, share, mode) {
      // Hero: large photo + outcome badge + name + party+constituency + optional vote share
      // Small: photo + outcome label + name + party badge + optional mini bar
      if (isHero) {
        const wrap = document.createElement('div');
        wrap.className = 'flex flex-col items-center text-center space-y-4';

        const photoWrap = document.createElement('div');
        photoWrap.className = 'relative';

        const circle = document.createElement('div');
        circle.className = 'w-36 h-36 rounded-full overflow-hidden border-4 border-stone-100 bg-stone-50';
        circle.appendChild(makeAvatar(cand && cand.photo, cand && cand.name, 'w-full h-full'));
        photoWrap.appendChild(circle);

        if (outcomeLabelText) {
          const badge = document.createElement('div');
          const isLeading = outcomeLabelText.toLowerCase() === 'leading';
          badge.className = `absolute -bottom-3 left-1/2 -translate-x-1/2 ${isLeading ? 'leading-badge' : 'won-badge'} text-white px-6 py-1 rounded-lg text-xs font-bold uppercase tracking-wide shadow-md`;
          badge.textContent = outcomeLabelText;
          photoWrap.appendChild(badge);
        }

        wrap.appendChild(photoWrap);

        const info = document.createElement('div');
        info.className = 'pt-2 w-full';

        const name = document.createElement('h2');
        name.className = 'text-base font-bold font-headline uppercase leading-tight tracking-tight mt-1';
        name.textContent = (cand && cand.name) ? cand.name : 'Not set';
        info.appendChild(name);

        // Row 1: party + alliance chips
        const chipsRow = document.createElement('div');
        chipsRow.className = 'flex items-center justify-center gap-2 mt-2 flex-wrap';

        const party = document.createElement('span');
        party.className = 'px-3 py-1 rounded-md text-xs font-bold uppercase';
        party.textContent = (cand && cand.party) ? cand.party : '—';
        applyChipColor(party, partyColorFromSheet(cand && cand.party));
        chipsRow.appendChild(party);

        if (cand && cand.alliance) {
          const alliance = document.createElement('span');
          alliance.className = 'px-3 py-1 rounded-md text-xs font-bold uppercase';
          alliance.textContent = cand.alliance;
          applyChipColor(alliance, allianceColorFromSheet(cand.alliance));
          chipsRow.appendChild(alliance);
        }

        info.appendChild(chipsRow);

        if (showVoteShare && Number.isFinite(share)) {
          const metric = metricLabelAndValue(mode, cand, share);
          const winnerBarClass = mode === 'counting' ? 'leading-bar' : 'won-bar';
          info.appendChild(makeVoteShareBar(share, winnerBarClass, metric.label, metric.value, mode === 'counting'));
        }

        wrap.appendChild(info);
        return wrap;
      } else {
        // Small challenger card
        // Use justify-between so chips+bar always align at the same level
        // regardless of whether the name wraps to 1 or 2 lines
        const wrap = document.createElement('div');
        wrap.className = 'flex flex-col justify-between h-full gap-2';

        // Top: avatar + outcome label + name
        const topRow = document.createElement('div');
        topRow.className = 'flex items-start gap-2.5';
        topRow.appendChild(makeAvatar(cand && cand.photo, cand && cand.name, 'w-10 h-10'));

        const textWrap = document.createElement('div');
        if (outcomeLabelText) {
          const outcome = document.createElement('span');
          const isTrailing = outcomeLabelText.toLowerCase() === 'trailing';
          outcome.className = `text-[10px] font-bold uppercase ${isTrailing ? 'trailing-label' : 'text-red-600'}`;
          outcome.textContent = outcomeLabelText;
          textWrap.appendChild(outcome);
        }
        const nm = document.createElement('h4');
        nm.className = 'text-xs font-bold font-headline leading-tight uppercase';
        nm.textContent = (cand && cand.name) ? cand.name : 'Not set';
        textWrap.appendChild(nm);
        topRow.appendChild(textWrap);
        wrap.appendChild(topRow);

        // Bottom: chips + vote bar — always anchored to the same level
        const bottom = document.createElement('div');
        bottom.className = 'flex flex-col gap-1';

        const partyRow = document.createElement('div');
        partyRow.className = 'flex items-center gap-1.5 flex-wrap w-full';
        const partyBadge = document.createElement('div');
        partyBadge.className = 'w-fit px-2 py-0.5 rounded text-[10px] font-bold uppercase';
        partyBadge.textContent = (cand && cand.party) ? cand.party : '—';
        applyChipColor(partyBadge, partyColorFromSheet(cand && cand.party));
        partyRow.appendChild(partyBadge);

        if (cand && cand.alliance) {
          const allianceBadge = document.createElement('div');
          allianceBadge.className = 'w-fit px-2 py-0.5 rounded text-[10px] font-bold uppercase';
          allianceBadge.textContent = cand.alliance;
          applyChipColor(allianceBadge, allianceColorFromSheet(cand.alliance));
          partyRow.appendChild(allianceBadge);
        }

        if (showVoteShare && Number.isFinite(share)) {
          const metricText = document.createElement('span');
          metricText.className = 'text-[10px] text-stone-500 font-semibold ml-auto text-right';
          const metric = metricLabelAndValue(mode, cand, share);
          metricText.textContent = metric.value;
          partyRow.appendChild(metricText);
        }
        bottom.appendChild(partyRow);

        if (showVoteShare && Number.isFinite(share)) {
          const track = document.createElement('div');
          track.className = 'h-1 bg-stone-200 rounded-full w-full';
          const fill = document.createElement('div');
          const fillClass = mode === 'counting' ? 'trailing-bar' : 'lost-bar';
          const animate = mode === 'counting';
          const barW = `${Math.max(2, Math.min(100, share))}%`;
          fill.className = `h-full rounded-full ${fillClass}${animate ? ' bar-counting' : ''}`;
          fill.style.setProperty('--bar-w', barW);
          if (!animate) fill.style.width = barW;
          track.appendChild(fill);
          bottom.appendChild(track);
        }

        wrap.appendChild(bottom);
        return wrap;
      }
    }

    function renderBattleCard(battle) {
      const mode = resolveViewModeForBattle(battle);
      const slots = [battle.candidates[0] || null, battle.candidates[1] || null, battle.candidates[2] || null];

      const totalVotes = slots.reduce((sum, c) => {
        const n = c && Number.isFinite(c.votesNum) ? c.votesNum : 0;
        return sum + n;
      }, 0);

      const outcomeLabel = winnerOutcomeLabel(mode);
      const challengerLabel = challengerOutcomeLabel(mode);
      const hasVotes = totalVotes > 0;
      const winnerShare = candidateVoteShare(slots[0], totalVotes);
      const loser1Share = candidateVoteShare(slots[1], totalVotes);
      const loser2Share = candidateVoteShare(slots[2], totalVotes);

      // Card wrapper
      const card = document.createElement('section');
      card.className = [
        'snap-start shrink-0 w-[85vw] md:w-auto',
        'bg-surface-container-lowest rounded-xl border border-stone-200 shadow-sm overflow-hidden p-5 space-y-5',
        'flex flex-col'
      ].join(' ');

      // Constituency heading — top of card, highest hierarchy
      const constituencyHeading = document.createElement('h3');
      constituencyHeading.className = 'text-lg font-extrabold font-headline tracking-tight text-stone-900 text-center';
      constituencyHeading.textContent = battle.constituency || '—';
      card.appendChild(constituencyHeading);

      // Hero candidate
      const heroSection = renderCandidateSection(
        slots[0], true, outcomeLabel,
        hasVotes && Number.isFinite(winnerShare), winnerShare, mode
      );
      card.appendChild(heroSection);

      // VS divider
      const vsDivider = document.createElement('div');
      vsDivider.className = 'relative flex items-center py-1';
      const line1 = document.createElement('div');
      line1.className = 'flex-grow border-t border-stone-200';
      const vsLabel = document.createElement('span');
      vsLabel.className = 'flex-shrink mx-3 bg-stone-900 text-white text-[10px] font-bold uppercase px-2 py-0.5 rounded-full';
      vsLabel.textContent = 'vs';
      const line2 = document.createElement('div');
      line2.className = 'flex-grow border-t border-stone-200';
      vsDivider.appendChild(line1);
      vsDivider.appendChild(vsLabel);
      vsDivider.appendChild(line2);
      card.appendChild(vsDivider);

      // Challengers grid
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 gap-3 items-stretch';

      const loser1Wrap = document.createElement('div');
      loser1Wrap.className = 'border-r border-stone-100 pr-3 flex flex-col';
      loser1Wrap.appendChild(renderCandidateSection(
        slots[1], false, challengerLabel,
        hasVotes && Number.isFinite(loser1Share), loser1Share, mode
      ));
      grid.appendChild(loser1Wrap);

      const loser2Wrap = document.createElement('div');
      loser2Wrap.className = 'flex flex-col';
      loser2Wrap.appendChild(renderCandidateSection(
        slots[2], false, challengerLabel,
        hasVotes && Number.isFinite(loser2Share), loser2Share, mode
      ));
      grid.appendChild(loser2Wrap);

      card.appendChild(grid);

      // Optional story CTA
      if (battle.storyUrl) {
        const cta = document.createElement('a');
        cta.href = battle.storyUrl;
        cta.target = '_blank';
        cta.rel = 'noopener';
        cta.className = 'mt-auto pt-3 text-xs font-semibold text-stone-500 hover:text-stone-900 flex items-center gap-1 border-t border-stone-100';
        cta.innerHTML = 'Read Full Story <span class="material-symbols-outlined text-[14px]">arrow_forward</span>';
        card.appendChild(cta);
      }

      return card;
    }

    // ── Search + render ───────────────────────────────────────────────────────

    function filterBattles(battles, query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return battles;
      return battles.filter((b) => {
        if (b.constituency.toLowerCase().includes(q)) return true;
        if (b.state.toLowerCase().includes(q)) return true;
        return b.candidates.some(
          (c) => (c.name || '').toLowerCase().includes(q) || (c.party || '').toLowerCase().includes(q)
        );
      });
    }

    function render(battles) {
      listEl.innerHTML = '';
      const q = searchEl.value;
      const visible = filterBattles(battles, q);

      if (!battles.length) {
        listEl.innerHTML = '<p class="text-stone-400 text-sm col-span-3 py-8 text-center">No battles found.</p>';
        return;
      }

      if (!visible.length) {
        const empty = document.createElement('p');
        empty.className = 'text-stone-400 text-sm col-span-3 py-8 text-center';
        empty.textContent = 'No results match your search.';
        listEl.appendChild(empty);
        return;
      }

      visible.forEach((battle) => listEl.appendChild(renderBattleCard(battle)));
    }

    async function init() {
      try {
        listEl.innerHTML = '<p class="text-stone-400 text-sm col-span-3 py-8 text-center">Loading key battles...</p>';
        const [rows, mappingRows, partyColorRows, allianceColorRows] = await Promise.all([
          loadRows(),
          loadLiveMappingRows(),
          loadPartyColorRows(),
          loadAllianceColorRows()
        ]);
        PARTY_COLORS = parsePartyColors(partyColorRows);
        ALLIANCE_COLORS = parseAllianceColors(allianceColorRows);
        const liveAllianceMapping = parseAllianceMappingRows(mappingRows);
        allBattles = buildBattles(rows, liveAllianceMapping);
        const filtered = BATTLE_PARAM
          ? allBattles.filter((b) => slugify(b.id) === slugify(BATTLE_PARAM) || slugify(b.rawId) === slugify(BATTLE_PARAM))
          : allBattles;
        allBattles = filtered;
        render(allBattles);
      } catch (err) {
        listEl.innerHTML = `<p class="text-red-600 text-sm font-semibold py-8 text-center">Failed to load key battles: ${err && err.message ? err.message : err}</p>`;
      }
    }

    searchEl.addEventListener('input', () => render(allBattles));

    init();
  </script>
</body>
</html>
