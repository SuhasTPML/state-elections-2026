<!-- Election page template: Tamil Nadu -->
<!-- Use this as the Tamil Nadu tab panel in your CMS. -->

<style>
  @font-face {
    font-family: "PvHeadline";
    src: url("https://fea.assettype.com/tpml/assets/PvHeadlineSemibold3.woff2") format("woff2");
    font-display: swap;
  }

  @font-face {
    font-family: "PrajavaniText";
    src: url("https://fea.assettype.com/tpml/assets/PrajavaniTextRegular.woff2") format("woff2");
    font-display: swap;
  }

  .election-widget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    align-items: start;
  }

  .election-widget-slot iframe {
    width: 100%;
    height: 500px;
    border: 0;
    display: block;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .election-widget-heading {
    margin: 0 0 10px;
    font-family: "PvHeadline", "PrajavaniText", serif;
    font-size: 28px;
    line-height: 1.1;
    color: #111827;
  }

  @media (max-width: 767px) {
    .election-widget-grid {
      grid-template-columns: 1fr;
    }
    .election-widget-heading {
      font-size: 24px;
    }
  }
</style>

<div class="election-widget-grid">
  <div class="election-widget-slot">
    <h2 class="election-widget-heading">Constituency Map</h2>
    <iframe
      title="Tamil Nadu Map Widget"
      loading="lazy"
      scrolling="no"
      src="https://suhastpml.github.io/state-elections-2026/map-widget.html?state=TAMIL_NADU&hideTabs=true"
      allowfullscreen>
    </iframe>
  </div>

  <div class="election-widget-slot">
    <h2 class="election-widget-heading">Results</h2>
    <iframe
      title="Tamil Nadu Seat Results Widget"
      loading="lazy"
      scrolling="no"
      src="https://suhastpml.github.io/state-elections-2026/seat-results-widget.html?state=TAMIL_NADU&compact=1&hideTabs=true"
      allowfullscreen>
    </iframe>
  </div>

  <div class="election-widget-slot">
    <h2 class="election-widget-heading">Key Battles</h2>
    <iframe
      title="Tamil Nadu Key Battles Widget"
      loading="lazy"
      scrolling="no"
      src="https://suhastpml.github.io/state-elections-2026/key-battles-widget.html?state=TAMIL_NADU&hideTabs=true"
      allowfullscreen>
    </iframe>
  </div>
</div>
