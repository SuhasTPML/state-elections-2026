<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elections Embed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f9fafb;
    color: #1f2937;
  }

  .embed-wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: 0;
  }

  iframe.auto-height {
    display: block;
    width: 100%;
    border: none;
    overflow: hidden;
    /* fallback height in case postMessage never fires (e.g. script stripped by CMS) */
    height: 600px;
    transition: height 0.2s ease;
  }
</style>
</head>
<body>

<div class="embed-wrapper">
  <!-- Map widget — src baked in so it works even if the CMS strips <script> -->
  <iframe
    id="iframe-map"
    class="auto-height"
    src="https://suhastpml.github.io/state-elections-2026/"
    scrolling="no"
    referrerpolicy="no-referrer-when-downgrade"
    title="Assembly Election Map"
    loading="lazy"
  ></iframe>

  <!-- Parliament / results widget -->
  <iframe
    id="iframe-results"
    class="auto-height"
    src="https://suhastpml.github.io/state-elections-2026/parliament-widget.html"
    scrolling="no"
    referrerpolicy="no-referrer-when-downgrade"
    title="Election Results"
    loading="lazy"
  ></iframe>
</div>

<script>
(function () {
  // Optionally forward ?state= and ?lang= from this page's URL into both iframes.
  var params = new URLSearchParams(location.search);
  var state = params.get('state') || '';
  var lang  = params.get('lang')  || '';

  function addParams(base) {
    var q = new URLSearchParams();
    if (state) q.set('state', state);
    if (lang)  q.set('lang',  lang);
    var qs = q.toString();
    return qs ? base + '?' + qs : base;
  }

  var mapIframe     = document.getElementById('iframe-map');
  var resultsIframe = document.getElementById('iframe-results');

  if (state || lang) {
    mapIframe.src     = addParams('https://suhastpml.github.io/state-elections-2026/');
    resultsIframe.src = addParams('https://suhastpml.github.io/state-elections-2026/parliament-widget.html');
  }

  // Auto-size iframes via postMessage height reports from the widgets.
  var iframeByWindow = new Map();

  function registerIframe(el) {
    el.addEventListener('load', function () {
      try { iframeByWindow.set(el.contentWindow, el); } catch (_) {}
    });
  }
  registerIframe(mapIframe);
  registerIframe(resultsIframe);

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'parliament-embed-size') return;
    var height = e.data.height;
    if (!height || height < 1) return;

    var target = iframeByWindow.get(e.source);
    if (!target) {
      [mapIframe, resultsIframe].forEach(function (el) {
        try { if (el.contentWindow === e.source) target = el; } catch (_) {}
      });
    }
    if (!target) return;

    target.style.height = height + 'px';
  });
})();
</script>

</body>
</html>
